# Explicit live-source development overlay. Do not use for releases.
services:
  api:
    # /healthz recomputes a package digest over the bind-mounted checkout on
    # every probe (~9s on Docker Desktop Windows shared filesystems vs ms on
    # in-image layers), so the 10s release healthcheck timeout flaps here.
    # Dev-only relief; the release timeout stays as is.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
    volumes:
      - ./api_service:/app/api_service
      - ./moonmind:/app/moonmind:ro
      - ./services:/app/services:ro
      - ./docs:/app/docs:ro
      - ./.agents:/app/.agents:ro
  temporal-worker-workflow:
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
    environment: &development-worker-environment
      - TEMPORAL_WORKER_VERSIONING_ENABLED=false
      - MOONMIND_DEPLOYMENT_MODE=development
  temporal-worker-artifacts:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
  temporal-worker-llm:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
  temporal-worker-sandbox:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
      - ./.agents:/app/.agents:ro
  temporal-worker-agent-runtime:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
      - ./.agents:/app/.agents:ro
  temporal-worker-deployment-control:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
      - ./.agents:/app/.agents:ro
  temporal-worker-integrations:
    environment: *development-worker-environment
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - ./services:/app/services:ro
  omnigent-runtime-bootstrap:
    volumes:
      - ./moonmind:/app/moonmind:ro
  init-db:
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./tools:/app/tools:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
