services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z@sha256:a62e44a7db506b8ed114a44e67b4996c4f1ecca981d9c6e40aa2581334999313
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    networks:
      control-plane-network:
        aliases:
          # Keep test MinIO off the production artifact hostname. The test
          # compose stack uses its own isolated network, so this alias stays
          # scoped to the test environment and avoids cross-stack DNS bleed.
          - moonmind-test-temporal-artifacts-s3

  pytest:
    image: ${MOONMIND_PYTHON_TEST_IMAGE:-moonmind-python-tests:local}
    # Preserve the existing bind-mounted developer workflow; managed workspace
    # jobs use the image's non-root app user against app-owned named volumes.
    user: root
    build:
      context: .
      dockerfile: api_service/Dockerfile
      target: test-runtime
      args:
        INSTALL_CODEX_CLI: "false"
        INSTALL_TEST_DEPS: "true"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - TEST_TYPE=unit
      - MOONMIND_FORCE_LOCAL_TESTS=1
      # The hermetic suite exercises non-auth behavior; declare the explicit
      # local auth posture (#4120) so a blank AUTH_PROVIDER from .env can
      # never flip the harness into an authenticated mode. Host operators
      # may still override to exercise other modes.
      - AUTH_PROVIDER=${AUTH_PROVIDER:-disabled}
      # Test processes use isolated temp roots; never let an inherited host
      # setting turn the generic pytest service into a destructive janitor.
      - MOONMIND_MANAGED_RUNTIME_JANITOR_ENABLED=false
      - MOONMIND_DOCKER_STORAGE_JANITOR_ENABLED=false
      - TEMPORAL_ARTIFACT_BACKEND=${TEMPORAL_ARTIFACT_BACKEND:-s3}
      - TEMPORAL_ARTIFACT_S3_ENDPOINT=http://moonmind-test-temporal-artifacts-s3:9000
      - TEMPORAL_ARTIFACT_S3_PUBLIC_ENDPOINT=http://moonmind-test-temporal-artifacts-s3:9000
      - TEMPORAL_ARTIFACT_S3_BUCKET=${TEMPORAL_ARTIFACT_S3_BUCKET:-moonmind-temporal-artifacts}
      - TEMPORAL_ARTIFACT_S3_ACCESS_KEY_ID=${TEMPORAL_ARTIFACT_S3_ACCESS_KEY_ID:-minioadmin}
      - TEMPORAL_ARTIFACT_S3_SECRET_ACCESS_KEY=${TEMPORAL_ARTIFACT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION=${MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION:-1}
    volumes:
      - ./:/app
      # Startup probes must neither consume nor overwrite deployment evidence
      # through the repository bind mount. --rm removes this test-owned volume.
      - /app/var
    working_dir: /app
    # Run all tests (Python + frontend) inside the container. The runtime image
    # includes npm, so frontend tests are fully supported without --python-only.
    command: ["bash", "-lc", "/app/tools/test_unit.sh"]
    depends_on:
      - minio
    networks:
      - control-plane-network

  cli-tooling-smoke:
    build:
      context: .
      dockerfile: api_service/Dockerfile
      args:
        INSTALL_CODEX_CLI: "false"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/moonmind
    command: ["bash", "-lc", "codex --version"]
    networks:
      - control-plane-network

networks:
  control-plane-network:
