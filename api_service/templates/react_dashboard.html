<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MoonMind</title>
  <script>
    (() => {
      // Follow the operating-system theme, including changes while the page is open.
      const root = document.documentElement;
      const query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      const apply = () => {
        const mode = query && query.matches ? "dark" : "light";
        root.classList.toggle("dark", mode === "dark");
        root.dataset.theme = mode;
      };
      apply();
      if (query && query.addEventListener) {
        query.addEventListener("change", apply);
      }
    })();
  </script>
  {{ assets_html | safe }}
</head>

<body>
  <div id="dashboard-app-root"></div>

  <script id="moonmind-ui-boot" type="application/json">
    {{ boot_payload | safe }}
  </script>
</body>

</html>
