slug: security-web-api
title: Web and API assessment
description: Run bounded ZAP baseline, API-definition or explicitly active checks on one authorized origin
  and routes. No unrestricted penetration testing or automatic expansion to other origins.
tags:
- security
- assessment
- web-assessment
releaseStatus: active
requiredCapabilities:
- sandbox
annotations:
  workflowPublish:
    mode: none
  inputSchema:
    type: object
    required:
    - assessment
    properties:
      goal:
        type: string
        title: Goal
        default: Run bounded ZAP baseline, API-definition or explicitly active checks on one authorized
          origin and routes. No unrestricted penetration testing or automatic expansion to other origins.
      assessment:
        additionalProperties: false
        description: 'One ZAP Automation Framework run against one admitted origin.


          ``baseline`` crawls and checks passively; ``api`` imports an admitted

          definition and checks passively; ``active`` adds the active scanner and

          is the only mode that sends attack payloads. One job tests at most one

          identity, so every observation is attributable to it.'
        properties:
          mode:
            enum:
            - baseline
            - api
            - active
            title: Mode
            type: string
            default: baseline
          assessmentRef:
            pattern: ^[a-z0-9][a-z0-9.-]{0,127}$
            type: string
            title: Assessment ref
          origin:
            title: Origin
            type: string
          routes:
            items:
              additionalProperties: false
              properties:
                path:
                  title: Path
                  type: string
                methods:
                  items:
                    enum:
                    - GET
                    - HEAD
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                    type: string
                  maxItems: 7
                  minItems: 1
                  title: Methods
                  type: array
              required:
              - path
              title: WebRoute
              type: object
            maxItems: 32
            minItems: 1
            title: Routes
            type: array
            default:
            - path: /
              methods:
              - GET
          startPaths:
            items:
              type: string
            maxItems: 16
            minItems: 1
            title: Start paths
            type: array
          exclusions:
            items:
              type: string
            maxItems: 64
            title: Exclusions
            type: array
          identity:
            additionalProperties: false
            description: 'One admitted test identity; its secret arrives only at launch.


              ``form`` posts ``username`` and the secret to ``loginPath``; ``bearer``

              sends the secret as a bearer token to the admitted origin only. The

              verification route must show ``loggedInMarker`` to the identity, and a

              form identity''s route must not show it anonymously, so authentication is

              checked rather than assumed. A bearer token rides on every request, so

              its marker must be specific to the identity, such as its account name.'
            properties:
              name:
                pattern: ^[a-z0-9][a-z0-9.-]{0,63}$
                title: Name
                type: string
              method:
                enum:
                - form
                - bearer
                title: Method
                type: string
              credentialRef:
                maxLength: 1024
                minLength: 4
                title: Credential ref
                type: string
              verificationPath:
                title: Verification path
                type: string
              loggedInMarker:
                maxLength: 1024
                minLength: 1
                title: Logged in marker
                type: string
              loginPath:
                type: string
                title: Login path
              username:
                maxLength: 256
                minLength: 1
                type: string
                title: Username
              usernameField:
                default: username
                pattern: ^[A-Za-z0-9_.-]{1,64}$
                title: Username field
                type: string
              passwordField:
                default: password
                pattern: ^[A-Za-z0-9_.-]{1,64}$
                title: Password field
                type: string
            required:
            - name
            - method
            - credentialRef
            - verificationPath
            - loggedInMarker
            title: Identity
            type: object
          apiDefinition:
            additionalProperties: false
            description: An authorized OpenAPI or GraphQL definition read from one artifact.
            properties:
              format:
                enum:
                - openapi
                - graphql
                title: Format
                type: string
              inputArtifactRef:
                pattern: ^art_[0-9A-Za-z]{1,64}$
                title: Input artifact ref
                type: string
              endpointPath:
                type: string
                title: Endpoint path
              maxBytes:
                default: 2097152
                maximum: 16777216
                minimum: 64
                title: Max bytes
                type: integer
            required:
            - format
            - inputArtifactRef
            title: Api definition
            type: object
          discovery:
            items:
              enum:
              - spider
              - ajax-spider
              type: string
            maxItems: 2
            title: Discovery
            type: array
          activeStrength:
            enum:
            - low
            - medium
            - high
            type: string
            title: Active strength
          egressPolicyRef:
            pattern: ^[a-z0-9][a-z0-9.-]{0,127}$
            title: Egress policy ref
            type: string
          maxRequestsPerSecond:
            default: 10
            maximum: 100
            minimum: 1
            title: Max requests per second
            type: integer
          maxDepth:
            default: 5
            maximum: 20
            minimum: 1
            title: Max depth
            type: integer
          maxChildren:
            default: 50
            maximum: 1000
            minimum: 1
            title: Max children
            type: integer
          outputDirectory:
            default: web-assessment
            title: Output directory
            type: string
          maxReportBytes:
            default: 8388608
            maximum: 8388608
            minimum: 128
            title: Max report bytes
            type: integer
          timeoutSeconds:
            default: 900
            maximum: 3600
            minimum: 300
            title: Timeout seconds
            type: integer
        required:
        - mode
        - origin
        - routes
        - egressPolicyRef
        title: Assessment
        type: object
        x-moonmind-input-contract: web-assessment
      baseline_ref:
        type: string
        title: Baseline ref
        description: Optional retained report for comparison. Omit for a first assessment.
steps:
- title: Collect evidence and assess
  repositoryOperation: read
  instructions: 'Use the portable security-review Skill and the supplied goal and assessment arguments.
    Execute exactly the assessment inputs through moonmind container web-assessment --admission <file>.
    Serialize assessment as JSON without changing target, rules, feeds, exclusions, credentials, network,
    timeout or source. Use the existing container-job owner; retain the job ID and native report artifact
    references. Reconcile uncertain submissions before retrying. Stop with actionable diagnostics if readiness
    or admission fails; never install substitutes, broaden scope or refresh feeds as a side effect.


    Interpret this step''s collected native evidence for the supplied goal. Reuse completed evidence;
    never repeat collection. Save an evidence-referenced security-review/v1 interpretation and readable
    report with findings, examined coverage, missing checks and honest exclusions. Compare baseline_ref
    only when supplied and accessible. Preserve native reports if interpretation fails.


    Preserve the selected workflow source, harness, Provider Profile, evidence-processing policy and publication
    choice. This assessment does not authorize remediation, infrastructure changes or publication. Use
    only the original remaining budget, including retries.'
  skill:
    id: security-review
    args:
      goal: '{{ inputs.goal }}'
      assessment: '{{ inputs.assessment }}'
      baseline_ref: '{{ inputs.baseline_ref }}'
    requiredCapabilities:
    - sandbox
  annotations:
    securityAssessment:
      kind: web-assessment
      admission: '{{ inputs.assessment }}'
      phase: collect
