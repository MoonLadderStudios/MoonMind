  required: false
  default: docs/
- name: traceability
  label: Traceability
  type: text
  required: false
  default: ''
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
steps:
- title: Author docs-native document
  type: skill
  annotations:
    documentAuthoringRole: author
