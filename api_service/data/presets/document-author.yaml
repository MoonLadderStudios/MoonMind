    Preferred area: {{ inputs.preferred_area }}

    Traceability: {{ inputs.traceability }}

    Constraints: {{ inputs.constraints }}


    Complete the authorized document or document set and return paths and verification evidence.'
  skill:
    id: document-author
    args: {}
    requiredCapabilities:
    - git
