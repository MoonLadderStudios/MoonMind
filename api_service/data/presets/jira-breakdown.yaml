slug: jira-breakdown
title: Breakdown and Jira Create
description: Break a preferred source input into MoonSpec story candidates, then create Jira Story issues from the generated breakdown.
scope: global
tags:
  - jira
  - moonspec
  - breakdown
  - stories
requiredCapabilities:
  - git
  - jira
annotations:
  sourceSkill: moonspec-breakdown
  output: jira
  # Jira issue creation is an external side effect, not repository publication: the
  # story breakdown is a temporary artifact, so this workflow publishes nothing.
  workflowPublish:
    mode: none
inputs:
  - name: feature_request
    label: Workflow Instructions
    type: markdown
    required: false
    default: ""
  - name: source_design_path
    label: Source Document Path
    type: repo_path
    required: false
    default: ""
  - name: source_issue_key
    label: Source Jira Issue Key
    type: text
    required: false
    default: ""
  - name: jira_project_key
    label: Jira Project Key
    type: text
    required: true
    default: MM
  - name: jira_issue_type
    label: Jira Issue Type
    type: text
    required: true
    default: Story
  - name: jira_dependency_mode
    label: Jira Dependency Mode
    type: enum
    required: true
    default: linear_blocker_chain
    options:
      - linear_blocker_chain
      - none
steps:
  - kind: include
    slug: story-breakdown-decompose
    alias: decompose
    scope: global
    inputMapping:
      source_design_path: "{{ inputs.source_design_path }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      feature_request: "{{ inputs.feature_request }}"
      provider_target: "jira"
      brief_artifact_path: "artifacts/jira-breakdown-brief.json"
  - kind: include
    slug: story-breakdown-publish
    alias: publish
    scope: global
    inputMapping:
      provider_target: "jira"
      jira_project_key: "{{ inputs.jira_project_key }}"
      jira_issue_type: "{{ inputs.jira_issue_type }}"
      jira_dependency_mode: "{{ inputs.jira_dependency_mode }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      child_preset: "none"
