slug: github-issue-search-and-implement
title: GitHub Issue Search and Implement
description: Search GitHub issues for the best eligible match created by the authenticated
  search account by default (enable Include issues created by other users to broaden
  author eligibility) under the shared lifecycle eligibility decision (Available means
  no MoonMind status label; Recovery-needed is a continuation candidate only with
  sufficient stopped-writer, prior-work, retry, and policy evidence), or the first
  eligible unblocked self-authored issue when the search is blank, then implement
  it following the GitHub Issue Implement workflow, adopting any safely recoverable
  partial PR and updating the issue.
scope: global
tags:
- github
- implementation
- pull-request
- search
requiredCapabilities:
- git
- gh
- docker
annotations:
  implementsPreset: github-issue-implement
  issueProvider: github
  output: pull-request
  titleEnrichment:
    enabled: true
    provider: github
    sourceTool: github.load_issue_preset_brief
    targetStyle: base-colon-hash
  githubIssueUpdate:
    inProgress:
      comment: true
      labelsToAdd:
      - 'status: in-progress'
      labelsToRemove: []
    codeReview:
      commentPullRequestUrl: true
      labelsToAdd:
      - 'status: code-review'
      labelsToRemove:
      - 'status: in-progress'
    done:
      closeIssue: true
      labelsToAdd:
      - 'status: done'
      labelsToRemove:
      - 'status: code-review'
  inputSchema:
    type: object
    required: []
    properties:
      issue_search:
        type: string
        title: GitHub issue search
        description: Free-text search used as '<search> is:issue state:open' for candidate
          discovery only; by default only issues created by the GitHub account used
          for this search are eligible (enable Include issues created by other users
          to broaden author eligibility). Every candidate is revalidated through the
          shared lifecycle eligibility decision (Available means no MoonMind status
          label, not no labels at all; Recovery-needed continuations require stopped-writer,
          prior-work, retry, and policy evidence; in-progress, code-review, needs-attention,
          closed, mixed/unknown states, unresolved active comments, and unsafe or
          incomplete handoffs are excluded). Leave blank to fall back to a bounded
          repository scan for the first eligible candidate without blocking dependencies.
          Safe recoveries within equivalent scope/priority are preferred under a bounded
          fair policy so one difficult issue cannot monopolize recurring runs.
      include_all_authors:
        type: boolean
        title: Include issues created by other users
        description: By default, only issues created by the GitHub account used for
          this search are eligible.
        default: false
      repository:
        type: string
        title: Repository
        description: GitHub owner/repository to search; defaults to the workflow repository
          when empty.
      constraints:
        type: string
        title: Constraints
      run_verify:
        type: boolean
        title: Run verification
        description: Run the MoonSpec verification and remediation gate before pull request creation and GitHub issue handoff.
        default: true
  uiSchema:
    issue_search:
      widget: text
      searchPlaceholder: Search GitHub issues
    include_all_authors:
      widget: checkbox
    repository:
      widget: text
      advanced: true
  defaults:
    include_all_authors: false
    run_verify: true
inputs:
- name: issue_search
  label: GitHub Issue Search
  type: text
  required: false
  default: ''
- name: include_all_authors
  label: Include issues created by other users
  type: boolean
  required: false
  default: false
- name: repository
  label: Repository
  type: text
  required: false
  default: ''
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
- name: run_verify
  label: Run Verification
  type: boolean
  required: false
  default: true
steps:
- title: Resolve GitHub issue and load trusted brief
  type: tool
  instructions: >-
    Resolve one eligible open issue created by the GitHub account used for this
    search by default (only when Include issues created by other users is explicitly
    enabled may another author's issue be selected) through the shared lifecycle
    eligibility decision and load its trusted issue brief, preserving the resolved
    identity and search evidence for downstream steps.

    Available means no MoonMind status label (ordinary labels do not block); a
    Recovery-needed issue is a continuation candidate only with sufficient
    stopped-writer, prior-work, retry, and policy evidence. Exclude in-progress,
    code-review, needs-attention, closed, mixed/unknown states, unresolved active
    comments, and unsafe or incomplete handoffs. Existing explicit blockers and
    prerequisite rules continue to apply. Search and cached results discover
    candidates only: directly revalidate issue, comments, relevant PRs, and admission
    state for the pinned repository identity, honoring the requested repository,
    query, explicit labels, constraints, and priority scope. Prefer safe recoveries
    within equivalent scope/priority under a bounded fair policy.

    Preserve bounded candidate, comment-page, prerequisite, and request budgets
    (500 candidates across five pages of 100; 100-request prerequisite budget).
    Return distinct no-eligible-candidate, incomplete-evidence, cooldown/hold,
    permission, and GitHub-unavailable outcomes. Do not silently widen the query,
    treat a rate-limited scan as empty, or launch a fresh attempt to escape
    exhausted retry history; inherit cross-device retry/cooldown/hold history.

    Recovery evidence arrives through the trusted workflow input channel only:
    a scheduler or reconciler that queues a continuation supplies the stopped
    predecessor and usable-handoff evidence (plus the exact prior PR selector)
    as workflow context, which this step forwards to the trusted tool. A fresh
    invocation without such evidence correctly admits only Available candidates;
    Recovery-needed candidates are passed over until sufficient evidence is
    supplied. The trusted tool never invents handoff evidence from prose.

    The trusted brief tool announces before expensive assessment and settles this
    attempt's own announcement/writers before any recandidation on a detected
    competitor. Preserve the resolved issue and predecessor across replay/retry and
    never repeat search during recovery of an already selected issue.
  tool:
    id: github.load_issue_preset_brief
    requiredCapabilities:
    - gh
    inputs:
      repository: '{{ inputs.repository or context.get(''repository'', '''') }}'
      issueSearch: '{{ inputs.issue_search }}'
      includeAllAuthors: '{{ inputs.include_all_authors }}'
      artifactPath: artifacts/github-issue-implement-brief.json
      predecessorStopped: '{{ context.get(''predecessorStopped'', context.get(''predecessor_stopped'', '''')) }}'
      handoffUsable: '{{ context.get(''handoffUsable'', context.get(''handoff_usable'', '''')) }}'
      priorWorkPullRequest: '{{ context.get(''priorWorkPullRequest'', context.get(''prior_work_pull_request'', context.get(''pullRequest'', context.get(''pull_request'', '''')))) }}'
- title: Assess resolved issue implementation state
  repositoryOperation: read
  type: skill
  instructions: |-
    Use the resolved issue in MoonMind trusted previous step context and the brief produced by github.load_issue_preset_brief. Read the durable brief attachment when present, and persist it to artifacts/github-issue-implement-brief.json for local implementation steps. Note the binding constraints for this run (empty means none):

    {{ inputs.constraints }}

    Following the GitHub Issue Implement preset (github-issue-implement) assessment stage and the issue-implement-assessment preset logic, assess whether the resolved issue is already implemented against the current repository checkout without editing code or mutating GitHub. Classify into exactly one verdict: FULLY_IMPLEMENTED, PARTIALLY_IMPLEMENTED, NOT_IMPLEMENTED, or BLOCKED.

    Record the verdict and met/partially-met/unmet requirements in the step result AND in artifacts/github-issue-implement-assessment.json with keys issue_provider (github), issue_ref, issue_url, verdict, branch, base_ref, mode, summary, and requirements. This verdict is the controlling input for every later step.
  skill:
    id: auto
    args:
      brief_artifact_path: artifacts/github-issue-implement-brief.json
      assessment_artifact_path: artifacts/github-issue-implement-assessment.json
    requiredCapabilities:
    - git
- title: Check resolved GitHub issue blockers before implementation
  type: tool
  instructions: |-
    Read the resolved issue from MoonMind trusted previous step context and artifacts/github-issue-implement-assessment.json (or the recorded verdict from the assess step) before deciding how to apply blocker results.

    Dispatch the registered github.check_issue_blockers tool with the resolved repository, issue number from the trusted previous step context, and the assessment verdict. The tool resolves the exact issue identity from the preserved trusted previous step context. Treat explicit blocking labels or a known blocker section in the issue body as blocker evidence, following the GitHub Issue Implement preset (github-issue-implement) blocker stage.

    If the recorded verdict is FULLY_IMPLEMENTED, report blocker findings for the record but do not stop finalization. Otherwise, if unresolved blockers are detected or blocker evidence cannot be evaluated from trusted GitHub data, emit a structured blocked outcome: write decision blocked with the blocker details AND a parser-recognized `Verdict: BLOCKED` line in the step result, then stop implementation. If the agent responds only with ordinary prose such as "found unresolved blockers" without the structured decision and verdict line, the plan MUST NOT advance to implementation.
  tool:
    id: github.check_issue_blockers
    requiredCapabilities:
    - gh
    inputs:
      repository: '{{ inputs.repository or context.get(''repository'', '''') }}'
      assessmentArtifactPath: artifacts/github-issue-implement-assessment.json
- title: Mark resolved GitHub issue In Progress
  type: tool
  instructions: |-
    Read the resolved issue from MoonMind trusted previous step context and artifacts/github-issue-implement-assessment.json (or the previous step's recorded verdict) before doing anything.

    If the recorded verdict is FULLY_IMPLEMENTED, skip the In Progress update because the issue is already implemented. If the recorded verdict is BLOCKED, stop without changing GitHub. Otherwise dispatch the registered github.update_issue_status tool with the resolved repository, resolved issue number, targetStatus In Progress, and mode start. The tool resolves the exact issue identity from preserved trusted previous step context and uses the declared assessment artifact path, so the update flows through the registered tool's assessment/verification/PR-artifact checks, confirmed GitHub response, and structured side-effect evidence.
  tool:
    id: github.update_issue_status
    requiredCapabilities:
    - gh
    inputs:
      repository: '{{ inputs.repository or context.get(''repository'', '''') }}'
      targetStatus: In Progress
      mode: start
      assessmentArtifactPath: artifacts/github-issue-implement-assessment.json
- title: Resolve existing pull request target
  type: skill
  annotations:
    issueImplementRole: existing-pr-resolution
  instructions: |-
    Read the resolved issue from MoonMind trusted previous step context and artifacts/github-issue-implement-brief.json before doing anything.

    Best-effort existing-PR resolution for a safely recoverable continuation: when the trusted brief carries prior-work evidence with an exact existing PR (the prior_work_pull_request / priorWorkPullRequest selector routed from the trusted input channel for a safely released partial PR from a stopped writer, e.g. a scheduled run on another device continuing this run's predecessor), dispatch the registered github.resolve_pull_request_target tool with the resolved repository and that PR selector so workspace preparation and downstream steps receive the exact existing PR and its validated current head. When the brief carries no prior-work PR selector, report resolution as skipped without failing and without creating a pull request. Never reset a continuation to the base branch. A partial PR is not a fully-implemented verdict; accepted evidence must match current requirements and code revision.
  skill:
    id: auto
    args:
      brief_artifact_path: artifacts/github-issue-implement-brief.json
      assessment_artifact_path: artifacts/github-issue-implement-assessment.json
    requiredCapabilities:
    - git
    - gh
- title: Implement resolved issue
  type: skill
  instructions: |-
    Read the resolved issue and brief from MoonMind trusted previous step context or its durable brief attachment, and read artifacts/github-issue-implement-assessment.json (or its durable assessment attachment). Binding constraints for this run (empty means none):

    {{ inputs.constraints }}

    Following the GitHub Issue Implement preset (github-issue-implement) work-PR implement stage for the resolved issue: if the verdict is FULLY_IMPLEMENTED, make no code changes and report implementation as skipped. If BLOCKED, stop without changes. If PARTIALLY_IMPLEMENTED, treat the assessment's unmet and partially-met requirements as the authoritative bounded backlog. If NOT_IMPLEMENTED, implement the work described by the brief. Scope strictly to the brief and acceptance criteria. Add or update tests covering the behavior changes.

    When the existing-PR resolution step produced an exact existing PR and validated current head, continue that same PR from its validated head: prepare the workspace from the existing head, implement only the remaining requirements, and update that PR. Preserve the resolved issue and predecessor across replay/retry. Never repeat search during recovery of an already selected issue, reset a continuation to the base branch, or create a second PR just because the preset normally produces one. Keep internal remediation within this one issue attempt.

    Preserve the resolved repository and issue number in commit messages so downstream verification and the pull request can reference them. Do not create a pull request from this step; verification and publication are owned by later steps.
  skill:
    id: auto
    args:
      brief_artifact_path: artifacts/github-issue-implement-brief.json
      assessment_artifact_path: artifacts/github-issue-implement-assessment.json
    requiredCapabilities:
    - git
    - gh
- title: Verify implementation
  enabled: '{{ inputs.run_verify }}'
  repositoryOperation: read
  type: skill
  instructions: |-
    Read artifacts/github-issue-implement-assessment.json (or the recorded verdict from the assess step) before doing anything.

    If the recorded verdict is FULLY_IMPLEMENTED and the implementation step did no code changes, report verification as already satisfied by the initial assessment and skip rerunning verification. If the recorded verdict is BLOCKED, stop without running verification.

    Otherwise run moonspec-verify against verification target issue_brief for the resolved github issue, using artifacts/github-issue-implement-brief.json as the authoritative brief and artifacts/github-issue-implement-assessment.json as the initial assessment. Write the complete structured verifier result to artifacts/github-issue-implement-verify.json. Do not modify source code or tests in this read-only verification step. Do not create a pull request until the controlling moonspec-verify verdict is FULLY_IMPLEMENTED.
  skill:
    id: moonspec-verify
    args:
      verification_target: issue_brief
      issue_provider: github
      brief_artifact_path: artifacts/github-issue-implement-brief.json
      assessment_artifact_path: artifacts/github-issue-implement-assessment.json
      verify_artifact_path: artifacts/github-issue-implement-verify.json
    requiredCapabilities:
    - git
- title: Remediation loop controller
  enabled: '{{ inputs.run_verify }}'
  type: skill
  annotations:
    issueImplementRole: moonspec-remediation-loop
    remediationLoop:
      kind: remediation_loop
      loopId: issue-implementation-remediation
      remediationTool:
        type: agent_runtime
        name: auto
        inputs:
          repositoryOperation: write
          selectedSkill: remediate-issue
          issue_provider: github
          brief_artifact_path: artifacts/github-issue-implement-brief.json
          verify_artifact_path: artifacts/github-issue-implement-verify.json
          instructions: 'Run the selected remediate-issue Skill. Before editing, read the complete latest authoritative verifier evidence materialized at gateResultPath and remainingWorkPath. Implement every safe named gap in one bounded pass while preserving the cumulative remediation workspace head. Run the required targeted checks and record evidence.'
      verificationTool:
        type: agent_runtime
        name: auto
        inputs:
          repositoryOperation: read
          selectedSkill: moonspec-verify
          instructions: 'Run the selected moonspec-verify Skill against the latest remediation workspace head. Do not modify source code or tests. Write the complete structured verifier result to artifacts/github-issue-implement-verify.json.'
          verification_target: issue_brief
          issue_provider: github
          brief_artifact_path: artifacts/github-issue-implement-brief.json
          assessment_artifact_path: artifacts/github-issue-implement-assessment.json
          verify_artifact_path: artifacts/github-issue-implement-verify.json
      workspacePolicy: continue_from_loop_head
      budgets:
        hardMaxAttempts: '6'
        maxConsecutiveSemanticNoProgress: 2
        maxRepeatedFailureSignature: 2
        maxEvidenceRetries: 1
        maxContractRepairs: 1
        maxWallClockSeconds: 7200
        providerBudget: null
        tokenBudget: null
        costBudget: null
      terminalPolicy:
        fullyImplemented: advance
        additionalWorkNeeded: continue_when_allowed
        blocked: stop
        noDetermination: retry_evidence_or_stop
        failedUnrecoverable: stop
      sideEffectPolicy: workflow_owned
      approvalPolicy: inherit
      publicationPolicy: evaluate_after_terminal
      continueAsNewAttemptThreshold: 3
  instructions: 'The workflow-owned remediation controller consumes the latest authoritative verification result for the resolved github issue. It creates a remediation Step Execution and a following moonspec-verify Step Execution only after the latest persisted continuation decision admits that semantic attempt. Each remediation attempt uses the cumulative workspace head, captures and advances the candidate before read-only verification, and keeps evidence retry, contract repair, and Activity retry counters separate from remediation attempts. Publication is evaluated only from the canonical stored continuation decision. This controller provides the durable retry loop and controlling verifier verdict that a single generic agent turn cannot supply.'
  skill:
    id: auto
    args: {}
    requiredCapabilities:
    - git
- title: Create pull request
  type: skill
  annotations:
    issueImplementRole: pull-request-handoff
  instructions: |-
    Read the resolved issue and brief from MoonMind trusted previous step context or its durable brief attachment, and read artifacts/github-issue-implement-assessment.json (or its durable assessment attachment). Binding constraints for this run (empty means none):

    {{ inputs.constraints }}

    The initial assessment verdict and the later verification verdict have different roles. Skip PR creation only when the initial assessment in artifacts/github-issue-implement-assessment.json was FULLY_IMPLEMENTED and this run produced no repository changes. If the initial assessment was BLOCKED, stop without changes. If it was NOT_IMPLEMENTED or PARTIALLY_IMPLEMENTED, publish the implementation produced by this run even when the restored work branch is clean and its commits are already pushed. When an exact existing PR and validated current head were resolved for this continuation, update that same PR rather than creating a second PR. A later FULLY_IMPLEMENTED verification approves that implementation for publication; it does not mean the work was already on the base branch and does not authorize a no-change outcome.

    {% if inputs.run_verify %}Only proceed when the latest controlling post-remediation moonspec-verify verdict in artifacts/github-issue-implement-verify.json is FULLY_IMPLEMENTED. If the verifier reported ADDITIONAL_WORK_NEEDED, NO_DETERMINATION, BLOCKED, or FAILED_UNRECOVERABLE, or if 6 remediation attempts have been exhausted without FULLY_IMPLEMENTED, stop without creating a pull request.{% else %}Confirm implementation is complete and the focused tests required by the issue have passed; verification was disabled for this run so do not require artifacts/github-issue-implement-verify.json.{% endif %}

    Commit intentional changes only (no raw credentials), push the non-protected work branch, and create a non-draft pull request. The pull request title must reference the resolved issue. The pull request body must include a summary, the verification outcome, tests run, remaining risks, AND a standalone `Closes <owner>/<repository>#<number>` line for the resolved issue (for example `Closes MoonLadderStudios/MoonMind#123`) so GitHub closes the issue on merge. A mere mention of the issue without the closing keyword is not sufficient. Propagate the resolved canonical issue identity (repository, number, url) into the PR artifact and publication handoffs. Record the confirmed pull_request_url in the step result and in artifacts/github-issue-implement-pr.json with keys issue_provider, issue_ref, repository, issue_number, and pull_request_url.
  skill:
    id: auto
    args:
      brief_artifact_path: artifacts/github-issue-implement-brief.json
      assessment_artifact_path: artifacts/github-issue-implement-assessment.json
      pr_artifact_path: artifacts/github-issue-implement-pr.json
      verify_artifact_path: artifacts/github-issue-implement-verify.json
    requiredCapabilities:
    - git
    - gh
- title: Finalize resolved GitHub issue status
  type: tool
  annotations:
    issueImplementRole: code-review-handoff
  instructions: |-
    Read the resolved issue from MoonMind trusted previous step context and artifacts/github-issue-implement-assessment.json (or the recorded verdict from the assess step) before changing GitHub.

    Terminal finalization ownership: failed, blocked, canceled, and exhausted
    controlling outcomes that never reach this success-path step are owned by
    the durable failed-attempt finalization boundary (the github_issue
    finalize_failed_attempt activity plus the periodic handoff reconciler),
    not by preset plan sequence: the workflow engine marks remaining plan
    nodes skipped after a failed or blocked result and returns immediately on
    cancellation, so a success-ordered preset node cannot serve as the
    terminal handler. This step finalizes only runs that arrive here through
    the success path; on any other controlling outcome, stop without changing
    GitHub and leave the attempt for the durable finalizer and reconciler.
    Keep internal remediation within this one issue attempt and inherit
    cross-device retry/cooldown/hold history; internal retries do not release
    or reset the issue budget.

    Route completed work to missing verification, review/merge follow-up, or status finalization under the admitted policy. Ordinary code-review issues remain excluded from implementation search; a partial PR does not constitute a fully implemented verdict and accepted evidence must match current requirements and code revision.

    If the recorded verdict is BLOCKED, stop without changing GitHub and report the blocking evidence. If the recorded verdict is FULLY_IMPLEMENTED, apply the configured Done strategy via the trusted GitHub update tool. Otherwise {% if inputs.run_verify %}read artifacts/github-issue-implement-verify.json and require the latest controlling verifier result to report FULLY_IMPLEMENTED before any Code Review update{% else %}confirm implementation is complete and the focused tests required by the issue have passed; verification was disabled for this run so do not require artifacts/github-issue-implement-verify.json{% endif %}. Then read artifacts/github-issue-implement-pr.json, verify it contains a pull_request_url for the resolved issue, and dispatch the registered github.update_issue_status tool with mode finalize_after_pr_or_done, the resolved repository and issue number, the PR artifact path, and the verification artifact path. {% if inputs.run_verify %}If the verifier artifact is missing, terminal, or still reports ADDITIONAL_WORK_NEEDED after remediation is exhausted, stop without changing GitHub.{% else %}If the pull request artifact is missing or lacks a confirmed pull_request_url, stop without changing GitHub.{% endif %} Do not assume a single organization's workflow; use the configured label/comment/close strategy exposed by the trusted GitHub update tool.
  tool:
    id: github.update_issue_status
    requiredCapabilities:
    - gh
    inputs:
      repository: '{{ inputs.repository or context.get(''repository'', '''') }}'
      mode: finalize_after_pr_or_done
      assessmentArtifactPath: artifacts/github-issue-implement-assessment.json
      pullRequestArtifactPath: artifacts/github-issue-implement-pr.json
      verificationArtifactPath: artifacts/github-issue-implement-verify.json
      requireVerification: '{{ inputs.run_verify }}'
