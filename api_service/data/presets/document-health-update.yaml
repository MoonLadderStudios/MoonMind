slug: document-health-update
title: Document Health Update
description: Review the health of a documentation scope with the dedicated review
  skill, then remediate only still-valid reported findings with the dedicated
  remediate skill through a readable report handoff.
scope: global
tags:
- documentation
- document-health
- remediation
requiredCapabilities:
- git
annotations:
  documentWorkflow: review-then-remediate
  output: document-health-remediation
inputs:
- name: documentation_scope
  label: Documentation Scope
  type: text
  required: true
  default: docs/
- name: report_path
  label: Health Report Path
  type: text
  required: false
  default: artifacts/document-health-review.json
- name: review_output_mode
  label: Review Output Mode
  type: enum
  required: false
  default: full_report
  options:
  - summary
  - full_report
  - json_ledger
  - patch_plan
- name: allowed_actions
  label: Allowed Actions
  type: text
  required: false
  default: ''
- name: allow_destructive
  label: Allow Destructive Actions
  type: boolean
  required: false
  default: false
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
steps:
- title: Document health review
  type: skill
  annotations:
    documentHealthRole: review
  instructions: |-
    Run the document-health-review skill for scope {{ inputs.documentation_scope }}.

    Write the structured health report to {{ inputs.report_path }} and hand that path to the next step. The report records the reviewed scope and a findings list (document path, issue type, authority group when applicable, severity, evidence, recommended remediation). When no health issues are found, record an empty findings list and say so explicitly.

    This is a review-only step. Do not edit documentation here; remediation owns authorized edits.
  skill:
    id: document-health-review
    args:
      target_scope: '{{ inputs.documentation_scope }}'
      report_path: '{{ inputs.report_path }}'
      output_mode: '{{ inputs.review_output_mode }}'
      constraints: '{{ inputs.constraints }}'
    requiredCapabilities:
    - git
- title: Document health remediate
  type: skill
  annotations:
    documentHealthRole: remediate
  instructions: |-
    Read {{ inputs.report_path }} (the structured health report from the review step) before doing anything.

    If the report records an empty findings list, make no documentation changes and report a verified no-op because the review found no document health issues.

    Otherwise remediate only findings that are still authorized and still valid against the current checkout, limited to the documents named in the report. Revalidate each finding's evidence first; hold back stale findings. Preserve unrelated user changes and report remediated, skipped, stale, and blocked findings individually with reasons and evidence.
  skill:
    id: document-health-remediate
    args:
      report_path: '{{ inputs.report_path }}'
      target_scope: '{{ inputs.documentation_scope }}'
      output_mode: '{{ inputs.review_output_mode }}'
      constraints: '{{ inputs.constraints }}'
      allowed_actions: '{{ inputs.allowed_actions }}'
      allow_destructive: '{{ inputs.allow_destructive }}'
    requiredCapabilities:
    - git
