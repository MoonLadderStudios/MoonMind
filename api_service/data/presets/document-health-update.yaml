slug: document-health-update
title: Document Health Update
description: Review a bounded documentation scope, then apply authorized still-valid findings through
  dedicated portable Skills.
scope: global
tags:
- documentation
- document-health
- remediation
requiredCapabilities:
- git
annotations:
  documentWorkflow: review-then-remediate
  output: document-health-remediation
  uiSchema:
    report_path:
      advanced: true
    output_mode:
      advanced: true
    allowed_actions:
      advanced: true
    allow_destructive:
      advanced: true
inputs:
- name: documentation_scope
  label: Documentation Scope
  type: text
  required: true
  default: docs/
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
- name: report_path
  label: Report Location
  type: text
  required: true
  default: artifacts/document-health-review.json
- name: output_mode
  label: Report Detail
  type: enum
  required: true
  default: summary
  options:
  - summary
  - full_report
  - patch_plan
- name: allowed_actions
  label: Permitted Actions
  type: enum
  required: true
  default: content
  options:
  - content
  - restructure
  - all
- name: allow_destructive
  label: Allow Removal of Document Paths or Unique Content
  type: boolean
  required: false
  default: false
steps:
- title: Document health review
  annotations:
    documentHealthRole: review
  instructions: 'Use the selected Skill for {{ inputs.documentation_scope }}. Pass the structured report
    at {{ inputs.report_path }} between these stages. Apply the caller constraints: {{ inputs.constraints
    }}.'
  skill:
    id: document-health-review
    args:
      scope: '{{ inputs.documentation_scope }}'
      report_path: '{{ inputs.report_path }}'
      output_mode: '{{ inputs.output_mode }}'
      constraints: '{{ inputs.constraints }}'
      allowed_actions: '{{ [''update'', ''reference_repair''] if inputs.allowed_actions == ''content''
        else ([''update'', ''reference_repair'', ''merge'', ''split'', ''move'', ''archive''] if inputs.allowed_actions
        == ''restructure'' else [''update'', ''reference_repair'', ''merge'', ''split'', ''move'', ''archive'',
        ''delete'']) }}'
      allow_destructive: '{{ inputs.allow_destructive }}'
    requiredCapabilities:
    - git
  type: skill
- title: Document health remediate
  annotations:
    documentHealthRole: remediate
  instructions: 'Use the selected Skill for {{ inputs.documentation_scope }}. Pass the structured report
    at {{ inputs.report_path }} between these stages. Apply the caller constraints: {{ inputs.constraints
    }}.'
  skill:
    id: document-health-remediate
    args:
      scope: '{{ inputs.documentation_scope }}'
      report_path: '{{ inputs.report_path }}'
      output_mode: '{{ inputs.output_mode }}'
      constraints: '{{ inputs.constraints }}'
      allowed_actions: '{{ [''update'', ''reference_repair''] if inputs.allowed_actions == ''content''
        else ([''update'', ''reference_repair'', ''merge'', ''split'', ''move'', ''archive''] if inputs.allowed_actions
        == ''restructure'' else [''update'', ''reference_repair'', ''merge'', ''split'', ''move'', ''archive'',
        ''delete'']) }}'
      allow_destructive: '{{ inputs.allow_destructive }}'
    requiredCapabilities:
    - git
  type: skill
