slug: issue-implement-assessment
title: Issue Implement Assessment
description: Assess whether an issue brief is already implemented before provider-specific
  lifecycle updates run.
scope: global
tags:
- implementation
- assessment
- issue
requiredCapabilities:
- git
annotations:
  sourceSkill: issue-implement-assessment
  issueProvider: neutral
  # Repository-read assessment: this preset forbids code changes and only writes
  # local handoff artifacts for later steps, so it publishes nothing.
  workflowPublish:
    mode: none
inputs:
- name: issue_provider
  label: Issue Provider
  type: text
  required: true
- name: issue_ref
  label: Issue Reference
  type: text
  required: false
  default: ''
  description: Explicit issue reference (for example owner/repo#123 or a Jira key).
    When empty, resolve the identity from trusted previous step context or the
    brief artifact. Never infer it from arbitrary prose. Missing identity must
    be rejected.
- name: issue_url
  label: Issue URL
  type: text
  required: false
  default: ''
  description: Issue URL when known. Empty resolves like issue_ref.
- name: brief_artifact_path
  label: Brief Artifact Path
  type: text
  required: true
- name: assessment_artifact_path
  label: Assessment Artifact Path
  type: text
  required: true
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
- name: completion_target_ref
  uiSchema:
    widget: text
    advanced: true
  description: Optional refs/heads/ branch ref; blank uses the remote default branch.
  label: Completion Target Ref
  type: text
  required: false
  default: ''
steps:
- title: Assess existing implementation state
  repositoryOperation: read
  annotations:
    issueImplementRole: initial-assessment
  instructions: |-
    Run moonspec-assess in issue-brief mode using the original trusted brief for {{ inputs.issue_provider }} issue {{ inputs.issue_ref }}.

    The trusted brief tool owns brief persistence, lossless field normalization,
    and completeness metadata at {{ inputs.brief_artifact_path }}. Do not copy,
    rewrite, or re-persist the brief from agent prose. Read it as original scope;
    reread the brief or assessment artifact only when identity or freshness
    requires it (new candidate, retry, or carried ref mismatch) and otherwise use
    the compact carried refs (briefArtifactRef, assessmentVerdict). This satisfies
    the portable moonspec-assess brief-preservation requirement through the trusted
    brief tool's output: the assessment step verifies and reads {{ inputs.brief_artifact_path }}
    or the exact durable attachment whose artifactPath identifies that brief.
    In an isolated sandbox, find that JSON under .moonmind/attachments/ by its
    issue identity and artifactPath; its opaque filename fulfills the same source
    requirement. Use its normalized source fields and completeness metadata without
    requiring a second copy at the original workspace path. Preserve the immutable
    initial inspection at {{ inputs.assessment_artifact_path }}
    without rewriting the brief from agent prose. When
    {{ inputs.issue_ref }} is empty, resolve the identity from trusted previous
    step context or the brief artifact with provenance checks; never infer it
    from arbitrary prose, and reject missing identity instead of proceeding.
    Supply the original scope and these constraints verbatim:

    {{ inputs.constraints }}

    The intended completion target override is {{ inputs.completion_target_ref }} (empty resolves the remote default branch). Keep it separate from the comparison base and current candidate. Follow the portable Skill for source recovery, bounded inspection, requirement evidence, and handoff semantics.

    During bounded inspection, persist a verification map for every visible
    requirement: its stable id, owning production boundary, executable checks,
    required capabilities, and expected terminal evidence. Preserve the candidate
    subject, original scope, completionTarget, and prerequisite readiness, permitted
    setup actions, and exact resume checks. Use at most two authorized setup attempts
    per prerequisite and retain their diagnostics and attempt counts across retries.
    Discover and attempt the repository or managed container verification path before
    declaring tooling unavailable. Carry this map and its prerequisite ledger into
    later implementation and verification evidence without overwriting the immutable
    initial assessment or treating its verdict as objective acceptance or landing.
    {% if inputs.issue_provider == 'github' %}

    MoonMind automation runs only in Linux containers. Decide whether any unmet
    requirement is work this runtime can do. If none is, because each one needs
    Windows or macOS, special or physical hardware (event machines, consoles,
    devices, a GPU or display this container cannot reach), physical presence,
    or another action no agent in a Linux container can perform, add
    `manualOnly` to {{ inputs.assessment_artifact_path }}:
    `{"reason": "<why automation cannot finish this issue>", "manualActions": ["<each action a person must take>"]}`.
    MoonMind then labels the issue manual-only and skips it until a person
    removes the label. Omit `manualOnly` when any unmet requirement can be
    advanced here, including repository changes and tests that run in a
    container; that work proceeds and verification records what remains. A
    missing credential, permission, or approval is not manual-only.
    {% endif %}
  skill:
    id: moonspec-assess
    args:
      issue_provider: '{{ inputs.issue_provider }}'
      issue_ref: '{{ inputs.issue_ref }}'
      completion_target_ref: '{{ inputs.completion_target_ref }}'
      brief_artifact_path: '{{ inputs.brief_artifact_path }}'
      assessment_artifact_path: '{{ inputs.assessment_artifact_path }}'
    requiredCapabilities:
    - git
