slug: github-issue-breakdown-implement
title: Breakdown and GitHub Issue Implement
description: Break a preferred source input into stories, create GitHub issues, then create dependent GitHub Issue Implement workflow executions for each generated issue.
scope: global
tags:
  - github
  - moonspec
  - breakdown
  - implement
requiredCapabilities:
  - git
  - gh
annotations:
  sourceSkill: github-issue-breakdown
  githubWorkflow: breakdown-to-dependent-implement
  output: dependent-github-issue-implement-workflows
  # Parent creates GitHub issues and queues dependent GitHub Issue Implement
  # children; each child receives the selected publish mode, so the parent
  # publishes nothing.
  workflowPublish:
    mode: none
inputs:
  - name: feature_request
    label: Workflow Instructions
    type: markdown
    required: false
    default: ""
  - name: source_design_path
    label: Source Document Path
    type: repo_path
    required: false
    default: ""
  - name: github_repository
    label: GitHub Repository
    type: text
    required: true
    default: ""
  - name: publish_mode
    label: Publish Mode
    type: enum
    required: true
    default: pr
    options:
      - pr
      - pr_with_merge_automation
      - branch
      - none
  - name: run_verify
    label: Run Verification
    type: boolean
    required: false
    default: true
  - name: source_issue_key
    label: Source Issue Key
    type: text
    required: false
    default: ""
steps:
  - kind: include
    slug: story-breakdown-decompose
    alias: decompose
    scope: global
    inputMapping:
      source_design_path: "{{ inputs.source_design_path }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      feature_request: "{{ inputs.feature_request }}"
      provider_target: "github"
      brief_artifact_path: ""
  - kind: include
    slug: story-breakdown-reconcile
    alias: reconcile
    scope: global
    inputMapping:
      provider_target: "github"
  - kind: include
    slug: story-breakdown-publish
    alias: publish
    scope: global
    inputMapping:
      provider_target: "github"
      github_repository: "{{ inputs.github_repository }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      child_preset: "github-issue-implement"
      publish_mode: "{{ inputs.publish_mode }}"
      run_verify: "{{ inputs.run_verify }}"
