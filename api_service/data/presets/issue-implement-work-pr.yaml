slug: issue-implement-work-pr
title: Issue Implement Work and Pull Request
description: Complete remaining issue implementation work, verify it, and publish
  a pull request using provider-neutral issue inputs.
scope: global
tags:
- implementation
- verification
- pull-request
- issue
requiredCapabilities:
- git
- gh
annotations:
  sourceSkill: issue-implement-work-pr
  issueProvider: neutral
  output: pull-request
inputs:
- name: issue_provider
  label: Issue Provider
  type: text
  required: true
- name: issue_ref
  label: Issue Reference
  type: text
  required: true
- name: brief_artifact_path
  label: Brief Artifact Path
  type: text
  required: true
- name: assessment_artifact_path
  label: Assessment Artifact Path
  type: text
  required: true
- name: pr_artifact_path
  label: Pull Request Artifact Path
  type: text
  required: true
- name: verify_artifact_path
  label: Verification Artifact Path
  type: text
  required: true
- name: verification_target
  label: Verification Target
  type: text
  required: false
  default: issue_brief
- name: remediation_max_attempts
  label: Remediation Max Attempts
  type: text
  required: false
  default: '6'
- name: run_verify
  label: Run Verification
  type: boolean
  required: false
  default: true
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
- name: completion_target_ref
  uiSchema:
    widget: text
    advanced: true
  description: Optional refs/heads/ branch ref; blank uses the remote default branch.
  label: Completion Target Ref
  type: text
  required: false
  default: ''
steps:
- title: Implement the issue
  instructions: |-
    Read {{ inputs.assessment_artifact_path }} (or the recorded verdict from the assess step) before doing anything.

    If the recorded verdict is FULLY_IMPLEMENTED, make no code changes and report that implementation is skipped because the issue is already implemented in the current repository state.

    If the recorded verdict is BLOCKED, stop without changing code and report the blocking evidence from the assessment.

    If the recorded verdict is PARTIALLY_IMPLEMENTED, treat the assessment's unmet and partially-met requirements as a bounded implementation backlog. Finish only the remaining gaps. Do not redo work that is already satisfied and do not broaden scope.

    If the recorded verdict is NOT_IMPLEMENTED, implement the work described by {{ inputs.issue_provider }} issue {{ inputs.issue_ref }} using the loaded issue preset brief as the authoritative implementation input.

    Additional constraints:
    {{ inputs.constraints }}

    Scope the implementation strictly to what the brief and acceptance criteria describe. Do not broaden scope, refactor unrelated code, or introduce backwards-compatibility shims unless the brief explicitly requires them.

    Follow the project's testing standards: add or update tests that cover the behavior changes required by the brief, and confirm the relevant unit and integration tests pass locally before continuing.

    Preserve {{ inputs.issue_provider }} issue {{ inputs.issue_ref }} in commit messages and in any implementation artifacts so downstream verification and the pull request can reference it.
  skill:
    id: auto
    args: {}
    requiredCapabilities:
    - git
- title: Verify implementation
  enabled: '{{ inputs.run_verify }}'
  repositoryOperation: read
  instructions: |-
    Run moonspec-verify against the original scope and constraints. The initial assessment is context, not objective proof. Reuse valid evidence only when it matches the current candidate content, original scope, requirement identities, completion policy, and required freshness; otherwise execute the missing checks. Bind objective success using validatedRefs.acceptance (acceptance/v1). Preserve incomplete source scope and mandatory evidence gaps; optional enrichment and diagnostics are disclosed limitations.

    Use verification target {{ inputs.verification_target }} for {{ inputs.issue_provider }} issue {{ inputs.issue_ref }}. Read {{ inputs.brief_artifact_path }} as original scope and {{ inputs.assessment_artifact_path }} as initial process context; no MoonSpec packet is required. Completion target override: {{ inputs.completion_target_ref }} (empty resolves the remote default).

    Write the complete verifier result to {{ inputs.verify_artifact_path }}. Return bounded remainingWork and the canonical continuation decision to the existing remediation controller; do not edit code or tests in this read-only step.
  skill:
    id: moonspec-verify
    args:
      completion_target_ref: '{{ inputs.completion_target_ref }}'
      constraints: '{{ inputs.constraints }}'
      verification_target: '{{ inputs.verification_target }}'
      issue_provider: '{{ inputs.issue_provider }}'
      issue_ref: '{{ inputs.issue_ref }}'
      brief_artifact_path: '{{ inputs.brief_artifact_path }}'
      assessment_artifact_path: '{{ inputs.assessment_artifact_path }}'
      verify_artifact_path: '{{ inputs.verify_artifact_path }}'
    requiredCapabilities:
    - git
- title: Remediation loop controller
  enabled: '{{ inputs.run_verify }}'
  annotations:
    issueImplementRole: moonspec-remediation-loop
    remediationLoop:
      kind: remediation_loop
      loopId: issue-implementation-remediation
      remediationTool:
        type: agent_runtime
        name: auto
        inputs:
          repositoryOperation: write
          selectedSkill: remediate-issue
          issue_provider: '{{ inputs.issue_provider }}'
          issue_ref: '{{ inputs.issue_ref }}'
          brief_artifact_path: '{{ inputs.brief_artifact_path }}'
          verify_artifact_path: '{{ inputs.verify_artifact_path }}'
          instructions: 'Run the selected remediate-issue Skill. Before editing,
            read the complete latest authoritative verifier evidence materialized by
            MoonMind at gateResultPath and remainingWorkPath. Implement every safe
            named gap in one bounded pass while preserving the cumulative remediation
            workspace head. When
            the verifier requires production workflow, Activity, adapter, persistence,
            or side-effect-owner evidence, exercise those production boundaries;
            do not substitute test-only models, dictionaries, mocks, or hard-coded
            identities. Run the required targeted checks and record evidence. If a
            gap is unsafe or cannot be completed, preserve the candidate and report
            the exact blocker with evidence instead of silently skipping it.'
      verificationTool:
        type: agent_runtime
        name: auto
        inputs:
          repositoryOperation: read
          selectedSkill: moonspec-verify
          completion_target_ref: '{{ inputs.completion_target_ref }}'
          constraints: '{{ inputs.constraints }}'
          instructions: 'Run the selected moonspec-verify Skill against the latest
            remediation workspace head using the supplied Skill inputs. Do not modify
            source code or tests. Write the complete structured verifier result to
            {{ inputs.verify_artifact_path }}.'
          verification_target: '{{ inputs.verification_target }}'
          issue_provider: '{{ inputs.issue_provider }}'
          issue_ref: '{{ inputs.issue_ref }}'
          brief_artifact_path: '{{ inputs.brief_artifact_path }}'
          assessment_artifact_path: '{{ inputs.assessment_artifact_path }}'
          verify_artifact_path: '{{ inputs.verify_artifact_path }}'
      workspacePolicy: continue_from_loop_head
      budgets:
        hardMaxAttempts: '{{ inputs.remediation_max_attempts }}'
        maxConsecutiveSemanticNoProgress: 2
        maxRepeatedFailureSignature: 2
        maxEvidenceRetries: 1
        maxContractRepairs: 1
        maxWallClockSeconds: 7200
        providerBudget: null
        tokenBudget: null
        costBudget: null
      terminalPolicy:
        fullyImplemented: advance
        additionalWorkNeeded: continue_when_allowed
        blocked: stop
        noDetermination: retry_evidence_or_stop
        failedUnrecoverable: stop
      sideEffectPolicy: workflow_owned
      approvalPolicy: inherit
      publicationPolicy: evaluate_after_terminal
      continueAsNewAttemptThreshold: 3
  instructions: 'The workflow-owned remediation controller consumes the latest authoritative
    verification result for {{ inputs.issue_provider }} issue {{ inputs.issue_ref }}.
    It creates a remediation Step Execution and a following moonspec-verify Step Execution
    only after the latest persisted continuation decision admits that semantic attempt.
    Each remediation attempt uses the cumulative workspace head, captures and advances
    the candidate before read-only verification, and keeps evidence retry, contract repair,
    and Activity retry counters separate from remediation attempts. Publication is evaluated
    only from the canonical stored continuation decision.'
  skill:
    id: auto
    args: {}
    requiredCapabilities:
    - git
- title: Create pull request
  annotations:
    issueImplementRole: pull-request-handoff
  instructions: |-
    Read {{ inputs.assessment_artifact_path }} (or the recorded verdict from the assess step) before doing anything.

    Skip publication only when objective acceptance evidence satisfies the freshly resolved intended completion target under the shared policy. A FULLY_IMPLEMENTED initial assessment alone cannot skip the PR. A later FULLY_IMPLEMENTED verifier result approves candidate work for review; it does not rewrite the initial assessment or prove landing. Publish candidate-only work through the existing PR path even when the worktree is clean and commits are already pushed. Reuse an exact existing PR for the same candidate when available.

    If the recorded verdict is BLOCKED, stop without creating a pull request and report the blocking evidence from the assessment.

    Otherwise create a pull request for the completed work for {{ inputs.issue_provider }} issue {{ inputs.issue_ref }} {% if inputs.run_verify %}only after the latest controlling post-remediation moonspec-verify verdict is FULLY_IMPLEMENTED in {{ inputs.verify_artifact_path }}. If the verifier reported ADDITIONAL_WORK_NEEDED, NO_DETERMINATION, BLOCKED, FAILED_UNRECOVERABLE, or ENVIRONMENT_CONTAMINATED_BY_SKILL_PROJECTION, or if {{ inputs.remediation_max_attempts }} remediation attempts have been exhausted without FULLY_IMPLEMENTED, stop without creating a pull request and report the verifier evidence.{% else %}after implementation is complete and the focused tests required by the issue have passed. Verification was disabled for this workflow execution, so do not require {{ inputs.verify_artifact_path }} or a moonspec-verify verdict before creating the pull request.{% endif %}

    This Issue Implement handoff step is the explicit PR-publication step for this preset. It intentionally owns pull request creation before the {{ inputs.issue_provider }} code review transition so the confirmed pull request URL is available to both {{ inputs.issue_provider }} and MoonMind publish handling. If generic managed-runtime guidance says not to push or create a pull request, treat this step-specific handoff instruction as the controlling instruction for this step only. If the workflow is submitted with PR merge automation enabled, the parent workflow must use the pull request URL produced by this step as the published PR and then run merge automation against that PR; {% if inputs.issue_provider == "github" %}the required closing keyword closes issue {{ inputs.issue_ref }} when the pull request merges, and parent-owned post-merge completion applies the configured Done labels and confirms the closed state{% else %}on a successful merge the parent workflow will transition {{ inputs.issue_provider }} issue {{ inputs.issue_ref }} to Done automatically{% endif %}. If the runtime instructions, workflow parameters, authentication, remote configuration, branch protection, or repository permissions prevent committing, pushing, or creating the pull request in this step, stop before changing Jira to Review and report the exact blocker.

    First confirm the working tree contains only intentional changes for this issue and no raw credentials. Commit the work with a concise message that includes {{ inputs.issue_ref }}. Push the current non-protected work branch and create a non-draft pull request with the available authenticated GitHub tooling.

    The pull request must be ready for review, not a draft. Do not pass draft flags when creating it. If the available tool or repository default creates a draft pull request, immediately mark it ready for review (for example, with the authenticated GitHub tooling's ready-for-review command) and verify the final pull request isDraft value is false before continuing.

    The pull request title must include {{ inputs.issue_ref }}. The pull request body must include:
    - the issue reference
    - {% if inputs.issue_provider == "github" %}a standalone `Closes {{ inputs.issue_ref }}` line so GitHub closes the issue only after the pull request merges{% else %}the issue tracker reference required by the configured review transition{% endif %}
    - a summary of the implementation
    - tests run
    - remaining risks

    After creation and non-draft verification, record the confirmed pull request URL in the step result and in a local handoff artifact at {{ inputs.pr_artifact_path }} with keys issue_provider, issue_ref, pull_request_url, and, for Jira compatibility when issue_provider is jira, jira_issue_key. Do not continue unless the pull_request_url is a GitHub pull request URL for the current work branch and the pull request is confirmed non-draft.
  skill:
    id: auto
    args: {}
    requiredCapabilities:
    - git
