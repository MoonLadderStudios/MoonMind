slug: jira-breakdown-implement
title: Breakdown and Jira Implement
description: Break a preferred source input into stories, create Jira issues, then create dependent Jira Implement workflow executions for each generated issue.
scope: global
tags:
  - jira
  - moonspec
  - breakdown
  - implement
requiredCapabilities:
  - git
  - jira
annotations:
  sourceSkill: jira-breakdown
  jiraWorkflow: breakdown-to-dependent-implement
  output: dependent-jira-implement-workflows
  # Parent creates Jira issues and queues dependent Jira Implement children; each
  # child receives its own publish policy, so the parent publishes nothing.
  workflowPublish:
    mode: none
inputs:
  - name: feature_request
    label: Workflow Instructions
    type: markdown
    required: false
    default: ""
  - name: source_design_path
    label: Source Document Path
    type: repo_path
    required: false
    default: ""
  - name: jira_project_key
    label: Jira Project Key
    type: text
    required: true
    default: MM
  - name: jira_issue_type
    label: Jira Issue Type
    type: text
    required: true
    default: Story
  - name: jira_dependency_mode
    label: Jira Dependency Mode
    type: enum
    required: true
    default: linear_blocker_chain
    options:
      - linear_blocker_chain
      - none
  - name: publish_mode
    label: Publish Mode
    type: enum
    required: true
    default: pr_with_merge_automation
    options:
      - pr
      - pr_with_merge_automation
  - name: run_verify
    label: Run Verification
    type: boolean
    required: false
    default: true
  - name: source_issue_key
    label: Source Jira Issue Key
    type: text
    required: false
    default: ""
steps:
  - kind: include
    slug: story-breakdown-decompose
    alias: decompose
    scope: global
    inputMapping:
      source_design_path: "{{ inputs.source_design_path }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      feature_request: "{{ inputs.feature_request }}"
      provider_target: "jira"
      brief_artifact_path: "artifacts/jira-breakdown-implement-brief.json"
  - kind: include
    slug: story-breakdown-reconcile
    alias: reconcile
    scope: global
    inputMapping:
      provider_target: "jira"
  - kind: include
    slug: story-breakdown-publish
    alias: publish
    scope: global
    inputMapping:
      provider_target: "jira"
      jira_project_key: "{{ inputs.jira_project_key }}"
      jira_issue_type: "{{ inputs.jira_issue_type }}"
      jira_dependency_mode: "{{ inputs.jira_dependency_mode }}"
      source_issue_key: "{{ inputs.source_issue_key }}"
      child_preset: "jira-implement"
      publish_mode: "{{ inputs.publish_mode }}"
      run_verify: "{{ inputs.run_verify }}"
