slug: jira-implement
title: Jira Implement
description: Move a Jira issue through implementation by first assessing the current
  state of the branch against the issue. Objective evidence on the completion target
  permits advancing directly to Done. Otherwise, finish partial work, create a PR, and
  advance the issue to Review. When PR merge automation is enabled the issue
  advances to Done automatically after merge.
scope: global
tags:
- jira
- implementation
- pull-request
requiredCapabilities:
- git
- jira
- gh
annotations:
  sourceSkill: jira-implement
  jiraWorkflow: implementation-to-code-review
  output: pull-request
  postMergeJiraCompletion: done_category
  inputSchema:
    type: object
    required:
    - jira_issue
    properties:
      jira_issue:
        type: object
        title: Jira issue
        description: Issue that will seed the workflow instructions and implementation
          context.
        required:
        - key
        properties:
          key:
            type: string
            title: Issue key
          summary:
            type: string
            title: Summary
          description:
            type: string
            title: Description
          url:
            type: string
            format: uri
            title: URL
          status:
            type: string
            title: Status
          assignee:
            type: string
            title: Assignee
      run_verify:
        type: boolean
        title: Run verification
        description: Run the MoonSpec verification and remediation gate before pull request creation and Jira finalization.
        default: true
  uiSchema:
    jira_issue:
      widget: jira.issue-picker
      dataSource: jira.issues
      searchPlaceholder: Search Jira issues
      allowManualKeyEntry: true
  defaults:
    run_verify: true
  issueInput:
    provider: jira
    objectInput: jira_issue
    refInput: jira_issue_key
    refPath:
    - key
  titleSynthesis:
    label: Jira Implement
    targetPriority:
    - jira_issue
    template: '{{ label }}: {{ issue.key }}{% if issue.summary %} — {{ issue.summary
      }}{% endif %}'
inputs:
- name: jira_issue_key
  label: Jira Issue Key
  type: text
  required: true
- name: constraints
  label: Constraints
  type: textarea
  required: false
  default: ''
- name: run_verify
  label: Run Verification
  type: boolean
  required: false
  default: true
- name: completion_target_ref
  description: Optional refs/heads/ branch ref; blank uses the remote default branch.
  label: Completion Target Ref
  type: text
  required: false
  default: ''
steps:
- title: Load Jira preset brief
  type: tool
  instructions: 'Fetch Jira issue {{ inputs.jira_issue_key }} through the deterministic
    trusted Jira tool surface.


    Build the canonical implementation input from the issue''s Jira preset brief.
    Prefer a normalized preset brief or recommended preset instructions when the Jira
    issue response exposes one. If that field is unavailable, synthesize the brief
    from the issue key, summary, description, acceptance criteria, and relevant implementation
    notes.


    Preserve the issue key in the brief so downstream implementation artifacts and
    the pull request can reference {{ inputs.jira_issue_key }}.'
  tool:
    id: jira.load_preset_brief
    requiredCapabilities:
    - jira
    args: {}
    inputs:
      issueKey: '{{ inputs.jira_issue_key }}'
      artifactPath: artifacts/jira-implement-brief.json
- kind: include
  slug: issue-implement-assessment
  alias: assess
  scope: global
  inputMapping:
    issue_provider: jira
    issue_ref: '{{ inputs.jira_issue_key }}'
    issue_url: "{{ inputs.jira_issue.url | default('') }}"
    brief_artifact_path: artifacts/jira-implement-brief.json
    assessment_artifact_path: artifacts/jira-implement-assessment.json
    completion_target_ref: '{{ inputs.completion_target_ref }}'
    constraints: '{{ inputs.constraints }}'
- title: Check Jira blockers before implementation
  type: tool
  instructions: |-
    Read artifacts/jira-implement-assessment.json (or the recorded verdict from the assess step) before deciding how to apply blocker results.

    Check Jira issue {{ inputs.jira_issue_key }} through the deterministic trusted Jira blocker preflight before any new implementation work starts.

    Jira Blocks direction is strict for Jira GET issue responses: when the target issue response exposes the other issue as outwardIssue and the link type says the outward relationship is "blocks", that other issue blocks {{ inputs.jira_issue_key }}. When the target issue response exposes the other issue as inwardIssue and the link type says the inward relationship is "is blocked by", {{ inputs.jira_issue_key }} blocks a later issue and that link MUST NOT block this implementation.

    Ignore non-blocker issue links for the blocker decision.

    Continue only when no blocker links exist or every detected blocking issue is status Done.

    If the initial assessment reports FULLY_IMPLEMENTED, record blocker findings and proceed to objective verification. It does not authorize an issue-completion transition.

    Otherwise (PARTIALLY_IMPLEMENTED or NOT_IMPLEMENTED), if any blocking issue is not Done, or if a blocker relationship exists but blocker status cannot be determined from trusted Jira data, stop the implementation immediately. Report a blocked outcome in the required JSON format (targetIssueKey, decision, blockingIssues, summary) and do not proceed to any subsequent steps, including implementation. Include {{ inputs.jira_issue_key }} as the targetIssueKey.

    Do not use raw Jira credentials, web scraping, hardcoded transition IDs, or prompt text alone to decide blocker state.
  targetIssueKey: '{{ inputs.jira_issue_key }}'
  blockerPreflight:
    targetIssueKey: '{{ inputs.jira_issue_key }}'
    linkType: Blocks
  tool:
    id: jira.check_blockers
    requiredCapabilities:
    - jira
    args:
      targetIssueKey: '{{ inputs.jira_issue_key }}'
      assessmentArtifactPath: artifacts/jira-implement-assessment.json
      blockerPreflight:
        targetIssueKey: '{{ inputs.jira_issue_key }}'
        linkType: Blocks
- title: Move Jira issue to In Progress
  type: tool
  instructions: |-
    Read the previous step's carried assessmentVerdict first, falling back to artifacts/jira-implement-assessment.json only when the tool can resolve that artifact, before doing anything.

    If the recorded verdict is FULLY_IMPLEMENTED, skip the In Progress transition entirely and report it as skipped because the issue is already implemented; do not move a likely-Done issue back into In Progress. The final step requires objective completion-target evidence or a confirmed PR.

    If the recorded verdict is BLOCKED, stop without changing Jira and report that the preset is blocked by the initial assessment.

    Otherwise (PARTIALLY_IMPLEMENTED or NOT_IMPLEMENTED), change Jira issue {{ inputs.jira_issue_key }} to status In Progress before implementation starts. Use the deterministic trusted Jira status tool. It must look up Jira's available transitions, match In Progress against transition target statuses or transition names, apply the returned transition ID, and re-fetch the issue when possible to report the confirmed status.
  tool:
    id: jira.update_issue_status
    requiredCapabilities:
    - jira
    args:
      issueKey: '{{ inputs.jira_issue_key }}'
      targetStatus: In Progress
      assessmentArtifactPath: artifacts/jira-implement-assessment.json
- kind: include
  slug: issue-implement-work-pr
  alias: work-pr
  scope: global
  inputMapping:
    issue_provider: jira
    issue_ref: '{{ inputs.jira_issue_key }}'
    brief_artifact_path: artifacts/jira-implement-brief.json
    assessment_artifact_path: artifacts/jira-implement-assessment.json
    completion_target_ref: '{{ inputs.completion_target_ref }}'
    pr_artifact_path: artifacts/jira-implement-pr.json
    verify_artifact_path: artifacts/jira-implement-verify.json
    verification_target: issue_brief
    remediation_max_attempts: '6'
    run_verify: '{{ inputs.run_verify }}'
    constraints: '{{ inputs.constraints }}'
- title: Finalize Jira status
  annotations:
    jiraImplementRole: final-transition
  instructions: |-
    Use the trusted issue status tool with the original issue identity, verification artifact, PR handoff, and intended completion target. The tool validates objective evidence and re-reads the completion target before applying the already-completed path. Candidate-only work follows the configured Code Review/Review path with its confirmed PR. Missing evidence returns bounded verification work; never infer completion from assessment prose, clean worktrees, or pushed commits.

    Follow the resolved moonspec-verify acceptance policy for scope, mandatory versus optional evidence, reuse, and completion. Original source and constraints define acceptance; assessment backlogs prioritize work and preserve previously met requirements as regression constraints.
  type: tool
  tool:
    id: jira.update_issue_status
    requiredCapabilities:
    - jira
    - gh
    inputs:
      issueKey: '{{ inputs.jira_issue_key }}'
      repository: '{{ context.get("repository") or context.get("repo", "") }}'
      mode: finalize_after_pr_or_done
      completionTargetRef: '{{ inputs.completion_target_ref }}'
      assessmentArtifactPath: artifacts/jira-implement-assessment.json
      pullRequestArtifactPath: artifacts/jira-implement-pr.json
      verificationArtifactPath: artifacts/jira-implement-verify.json
      requireVerification: '{{ inputs.run_verify }}'
