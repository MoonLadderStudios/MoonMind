# Manifest — Full Multi-Source Example (vector-free)
# See: docs/Rag/LlamaIndexManifestSystem.md §4
#
# MoonMind is vector-free: manifests declare sources and transforms and
# compile to an executable plan. No embedding credentials, vector store
# connection, collection, or retrieval index configuration is required.

version: "v0"

metadata:
  name: "full-kitchen-sink"
  description: "Multi-source ingest with evaluation"
  owner: "moonmind-team"
  tags: ["multi-source", "evaluation", "example"]

llm:
  provider: "google"
  model: "gemini-2.0-flash"
  temperature: 0.1

dataSources:
  - id: "github-docs"
    type: "GithubRepositoryReader"
    params:
      owner: "MoonLadderStudios"
      repo: "MoonMind"
      branch: "main"
      filterExtensions: [".md"]
    auth:
      githubToken: "${GITHUB_TOKEN}"

  - id: "local-specs"
    type: "SimpleDirectoryReader"
    params:
      inputDir: "./specs"
      recursive: true
      requiredExts: [".md"]

  - id: "confluence-wiki"
    type: "ConfluenceReader"
    params:
      spaceKey: "MOONMIND"
      maxPages: 100
    auth:
      baseUrl: "${CONFLUENCE_URL}"
      token: "${CONFLUENCE_TOKEN}"

transforms:
  htmlToText: true
  splitter:
    type: "TokenTextSplitter"
    chunkSize: 1200
    chunkOverlap: 150
  enrichMetadata:
    - type: "TitleExtractor"

evaluation:
  datasets:
    - name: "smoke"
      path: "examples/eval/smoke.jsonl"
  metrics:
    - name: "hitRate@10"
      threshold: 0.8
    - name: "ndcg@10"
      threshold: 0.7

run:
  concurrency: 6
  batchSize: 128
  errorPolicy: "continue"

security:
  piiRedaction: true
  allowlistMetadata:
    - "source"
    - "title"
    - "chunk_id"
    - "file_path"

scheduling: "manual"
