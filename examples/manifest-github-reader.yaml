# Manifest — Minimal GitHub Reader Example (vector-free)
# See: docs/Rag/LlamaIndexManifestSystem.md §4
#
# MoonMind is vector-free: manifests declare sources and transforms and
# compile to an executable plan. No embedding credentials, vector store
# connection, collection, or retrieval index configuration is required.

version: "v0"

metadata:
  name: "github-reader-minimal"
  description: "Read a single GitHub repository"
  owner: "moonmind-team"
  tags: ["github", "example"]

dataSources:
  - id: "moonmind-repo"
    type: "GithubRepositoryReader"
    params:
      owner: "MoonLadderStudios"
      repo: "MoonMind"
      branch: "main"
      filterExtensions:
        - ".md"
        - ".py"
    auth:
      githubToken: "${GITHUB_TOKEN}"

transforms:
  splitter:
    type: "TokenTextSplitter"
    chunkSize: 1000
    chunkOverlap: 100

run:
  concurrency: 4
  batchSize: 64
  errorPolicy: "continue"
