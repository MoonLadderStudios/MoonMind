# Manifest — Full Multi-Source Example (vector-free)
# See: docs/Rag/LlamaIndexManifestSystem.md §4
#
# MoonMind is vector-free: manifests declare sources and transforms and
# compile to an executable plan. No embedding credentials, vector store
# connection, collection, or retrieval index configuration is required.

version: "v0"
metadata:
  name: "moonmind-kitchen-sink"
  description: "Multi-source ingest with evaluation"
  owner: "search-platform@moonladdr"
  tags: ["demo","full","example"]

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.0

dataSources:
  - id: "github-code-docs"
    type: "GithubRepositoryReader"
    params:
      owner: "MoonLadderStudios"
      repo: "MoonMind"
      branch: "main"
      include: ["**/*.py","**/*.md"]
      exclude: ["tests/**","**/__pycache__/**","**/*.png","**/*.jpg"]
      maxFiles: 5000
    auth:
      githubToken: "${GITHUB_TOKEN}"
    schedule: "0 4 * * *"   # nightly cron (optional)

  - id: "gdrive-specs"
    type: "GoogleDriveReader"
    params:
      folderId: "${SPECS_FOLDER_ID}"
      mimeTypes: ["application/pdf","application/vnd.google-apps.document"]

  - id: "local-handbook"
    type: "SimpleDirectoryReader"
    params:
      inputDir: "./handbook"
      recursive: true
      requiredExts: [".md",".txt"]

transforms:
  htmlToText: true
  splitter:
    type: "TokenTextSplitter"
    chunkSize: 800
    chunkOverlap: 120
  enrichMetadata:
    - type: "PathToTags"
    - type: "InferDocType"   # code|design|spec|handbook

evaluation:
  datasets:
    - name: "smoke"
      path: "./examples/eval/smoke.jsonl"
  metrics:
    - name: "hitRate@10"
      threshold: 0.80
    - name: "ndcg@10"
      threshold: 0.70

run:
  concurrency: 12
  batchSize: 512
  errorPolicy: "continue"
  dryRun: false

observability:
  tracing: "opentelemetry"
  logs: "stdout"

security:
  piiRedaction: true
  allowlistMetadata: ["path","repo","branch","owner","docType"]

scheduling: "manual"
