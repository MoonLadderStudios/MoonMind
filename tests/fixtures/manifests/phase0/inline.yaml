# Preserved historical evidence (MoonLadderStudios/MoonMind#4108 / #4115).
# This fixture retains a retired qdrant vectorStore block so the cutover
# rehearsal gate can verify historical readability. It is not a live
# surface: new submissions carrying retired blocks are rejected before
# fetch/dispatch. Do not copy these blocks into new manifests.
version: "v0"
metadata:
  name: "demo-manifest"
embeddings:
  provider: "openai"
  model: "text-embedding-3-small"
vectorStore:
  type: "qdrant"
  indexName: "manifest-phase0"
dataSources:
  - id: "repo-docs"
    type: "GithubRepositoryReader"
    params:
      owner: "moon"
      repo: "mind"
run:
  dryRun: false
