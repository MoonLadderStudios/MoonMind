# Isolated Docker daemon: qualification cannot see the installed deployment.
services:
  engine:
    image: docker:28-dind
    hostname: moonmind-test-resource-engine
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false", "--exec-opt", "native.cgroupdriver=cgroupfs"]
    volumes:
      - workspaces:/workspaces
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 3s
      retries: 40
  pytest:
    image: moonmind-python-tests:local
    user: root
    build:
      context: ../../..
      dockerfile: api_service/Dockerfile
      target: test-runtime
      args:
        INSTALL_CODEX_CLI: "false"
        INSTALL_TEST_DEPS: "true"
    environment:
      DOCKER_HOST: tcp://engine:2375
      AUTH_PROVIDER: disabled
      MOONMIND_FORCE_LOCAL_TESTS: "1"
      MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION: "1"
      MOONMIND_TEST_RESOURCE_DOCKER: "1"
      PYTHONPATH: /app
    volumes:
      - ../../..:/app
      - workspaces:/workspaces
    working_dir: /app
    command: ["python", "-m", "pytest", "tests/integration/resource_allocation", "-q", "--basetemp=/workspaces/pytest", "--junitxml=artifacts/pytest-resource-allocation.xml"]
    depends_on:
      engine:
        condition: service_healthy
volumes:
  workspaces:
