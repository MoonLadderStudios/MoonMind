# Disposable dependencies for authority-handoff qualification; never the installed stack.
# MoonLadderStudios/MoonMind#4376: every backend-matrix reliability shard
# starts this file under its own isolated Docker project name
# (moonmind-reliability-<suite>) with its own network and volumes, so no
# mutable release state is shared between shards. Dependency-layer reuse
# comes from the native Docker layer cache (pinned upstream images pulled
# once per runner) plus the workflow pip cache; no custom cache subsystem.
services:
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: reliability
      MINIO_ROOT_PASSWORD: reliability-test-only
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: reliability-test-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: reliability-test-only
      POSTGRES_SEEDS: postgres
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: 'true'
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/reliability-dynamic.yaml
    volumes:
      - ./temporal-dynamic.yaml:/etc/temporal/reliability-dynamic.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
