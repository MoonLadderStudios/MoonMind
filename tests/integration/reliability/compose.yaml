# Disposable dependencies for authority-handoff qualification; never the installed stack.
# Each reliability shard has its own project, network and volumes. Docker's
# layer cache and the workflow pip cache reuse immutable dependency bytes.
services:
  minio:
    # Same maintained S3 server as the production and integration stacks.
    image: ${TEMPORAL_ARTIFACT_S3_IMAGE:-pgsty/silo:latest}
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 2s
      timeout: 5s
      retries: 45
    command: server /data
    volumes:
      - artifact-data:/data
    environment:
      MINIO_ROOT_USER: reliability
      MINIO_ROOT_PASSWORD: reliability-test-only
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: reliability-test-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: reliability-test-only
      POSTGRES_SEEDS: postgres
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: 'true'
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/reliability-dynamic.yaml
    volumes:
      - ./temporal-dynamic.yaml:/etc/temporal/reliability-dynamic.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  artifact-data:
