events {}

http {
  server {
    listen 443 ssl;
    server_name allowed.test;
    ssl_certificate /tmp/cert.pem;
    ssl_certificate_key /tmp/key.pem;

    location = /health {
      return 200 "approved\n";
    }

    location = /redirect-forbidden {
      return 302 https://forbidden.test/;
    }
  }
}
