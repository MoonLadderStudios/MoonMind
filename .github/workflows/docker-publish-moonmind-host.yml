name: Release / Build omnigent-host-moonmind Image

# One shared image carries Codex, Claude Code, and OpenCode. Scheduled builds
# refresh it even when the upstream base is unchanged; manual and source-change
# builds can reuse the build cache.

on:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches: [ main ]
    paths:
      - "services/omnigent/moonmind-host/**"
      - "services/omnigent/tools/manifest.lock.json"
      - "services/omnigent/scripts/moonmind-container-cli.py"
      - "services/omnigent/scripts/moonmind-tools.sh"
      - "moonmind/omnigent/harness_platform/host_classes.py"
      - "moonmind/omnigent/harness_platform/runtime_packs.py"
      - ".github/workflows/docker-publish-moonmind-host.yml"
  workflow_dispatch:
    inputs:
      codex_cli_version:
        description: "Override the Dockerfile Codex pin (>=0.100.0,<0.200.0)"
        required: false
        type: string
      claude_cli_version:
        description: "Override the Dockerfile Claude Code pin (>=2.0.0,<3.0.0)"
        required: false
        type: string
      opencode_version:
        description: "Override the Dockerfile OpenCode pin (>=1.17.7,<1.19.0)"
        required: false
        type: string
      gh_version:
        description: "gh CLI version to bake in (must match services/omnigent/tools/manifest.lock.json)"
        required: false
        type: string

concurrency:
  group: release-omnigent-host-moonmind
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/moonladderstudios/omnigent-host-moonmind

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      codex_version: ${{ steps.meta.outputs.codex_version }}
      claude_version: ${{ steps.meta.outputs.claude_version }}
      opencode_version: ${{ steps.meta.outputs.opencode_version }}
      gh_version: ${{ steps.meta.outputs.gh_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve build pins and image metadata
        id: meta
        env:
          CODEX_CLI_VERSION_INPUT: ${{ inputs.codex_cli_version }}
          CLAUDE_CLI_VERSION_INPUT: ${{ inputs.claude_cli_version }}
          OPENCODE_VERSION_INPUT: ${{ inputs.opencode_version }}
          GH_VERSION_INPUT: ${{ inputs.gh_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          dockerfile = Path("services/omnigent/moonmind-host/Dockerfile").read_text()
          pins = dict(re.findall(r"^ARG ([A-Z_]+)=(.+)$", dockerfile, re.MULTILINE))
          versions = {}
          for output, argument in (
              ("codex_version", "CODEX_CLI_VERSION"),
              ("claude_version", "CLAUDE_CLI_VERSION"),
              ("opencode_version", "OPENCODE_VERSION"),
          ):
              version = os.environ.get(f"{argument}_INPUT") or pins[argument]
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
                  raise SystemExit(f"{argument} must be an exact release version")
              versions[output] = version
          manifest = json.loads(Path("services/omnigent/tools/manifest.lock.json").read_text())
          gh_pin = next(tool["version"] for tool in manifest["tools"] if tool["name"] == "gh")
          if os.environ.get("GH_VERSION_INPUT") not in (None, "", gh_pin):
              raise SystemExit("gh_version must match manifest.lock.json")
          versions["gh_version"] = gh_pin
          versions["image_name"] = os.environ["REGISTRY_IMAGE"].lower()
          versions["version_tag"] = (
              f"{versions['opencode_version']}-codex{versions['codex_version']}"
              f"-claude{versions['claude_version']}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in versions.items():
                  print(f"{key}={value}", file=output)
          PY

  build:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Omnigent base digest
        id: base
        run: |
          set -euo pipefail
          if [ -n "${{ vars.OMNIGENT_BASE_IMAGE_REF || '' }}" ]; then
            BASE_REF="${{ vars.OMNIGENT_BASE_IMAGE_REF }}"
            if ! echo "$BASE_REF" | grep -qE '@sha256:[0-9a-f]{64}$'; then
              echo "::error::OMNIGENT_BASE_IMAGE_REF must be digest-pinned (got $BASE_REF)" >&2
              exit 1
            fi
            echo "base_image=${BASE_REF}" >> "$GITHUB_OUTPUT"
            DIGEST="$(echo "$BASE_REF" | grep -oE 'sha256:[0-9a-f]{64}')"
            echo "base_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Using pinned base from vars: ${BASE_REF}"
          else
            BASE_TAG="ghcr.io/omnigent-ai/omnigent-host:latest"
            echo "Resolving ${BASE_TAG} to digest-pinned ref..."
            docker pull "${BASE_TAG}" >/dev/null
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${BASE_TAG}" 2>/dev/null | grep -oE 'sha256:[0-9a-f]{64}' || true)"
            if [ -z "${DIGEST}" ]; then
              DIGEST="$(docker buildx imagetools inspect "${BASE_TAG}" --format '{{json .Manifest}}' 2>/dev/null | grep -oE 'sha256:[0-9a-f]{64}' | head -n1 || true)"
            fi
            if [ -z "${DIGEST}" ]; then
              echo "::error::Failed to resolve base image digest for ${BASE_TAG}" >&2
              exit 1
            fi
            if [[ "${DIGEST}" != sha256:* ]]; then
              DIGEST="sha256:${DIGEST}"
            fi
            PINNED="ghcr.io/omnigent-ai/omnigent-host@${DIGEST}"
            echo "base_image=${PINNED}" >> "$GITHUB_OUTPUT"
            echo "base_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Resolved base to ${PINNED}"
          fi

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare build metadata
        id: meta
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ needs.metadata.outputs.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/omnigent/moonmind-host/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            OMNIGENT_HOST_BASE_IMAGE=${{ steps.base.outputs.base_image }}
            OMNIGENT_BUILD_DIGEST=${{ steps.base.outputs.base_digest }}
            CODEX_CLI_VERSION=${{ needs.metadata.outputs.codex_version }}
            CODEX_MIN_VERSION=0.100.0
            CODEX_MAX_VERSION=0.200.0
            CLAUDE_CLI_VERSION=${{ needs.metadata.outputs.claude_version }}
            CLAUDE_MIN_VERSION=2.0.0
            CLAUDE_MAX_VERSION=3.0.0
            OPENCODE_VERSION=${{ needs.metadata.outputs.opencode_version }}
            OPENCODE_MIN_VERSION=1.17.7
            OPENCODE_MAX_VERSION=1.19.0
            OMNIGENT_GH_VERSION=${{ needs.metadata.outputs.gh_version }}
          outputs: type=image,name=${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=moonmind-host-${{ steps.meta.outputs.pair }}
          cache-to: type=gha,scope=moonmind-host-${{ steps.meta.outputs.pair }},mode=max
          provenance: true
          sbom: true

      - name: Verify vendor runtimes in image
        run: |
          digest="${{ steps.build.outputs.digest }}"
          image="${{ steps.meta.outputs.image_name }}@${digest}"
          echo "Verifying ${image}"
          docker pull "${image}" || true
          docker run --rm "${image}" sh -c 'command -v codex && codex --version'
          docker run --rm "${image}" sh -c 'command -v claude && claude --version'
          docker run --rm "${image}" sh -c 'command -v opencode && opencode --version | grep -E "1\.(17|18)"'

      - name: Verify offline OpenCode plugin startup
        run: |
          image="${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}"
          sh ./services/omnigent/moonmind-host/verify-warm-plugin-cache.sh "${image}"

      - name: Verify image-owned helper tools without network or volumes
        run: |
          image="${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}"
          gh_version="${{ needs.metadata.outputs.gh_version }}"
          echo "Verifying image-owned gh/moonmind in ${image}"
          # No tools volume is mounted: the selected image owns its tools.
          docker run --rm --network none --user 1000:1000 "${image}" \
            sh -c 'test -x /opt/moonmind-tools/bin/gh && test -x /opt/moonmind-tools/bin/moonmind && test -r /opt/moonmind-tools/manifest.json'
          docker run --rm --network none --user 1000:1000 "${image}" \
            sh -c "gh --version | grep -F '${gh_version}'"
          docker run --rm --network none --user 1000:1000 "${image}" moonmind --help
          # Ordinary and login shells resolve the image-owned executables.
          docker run --rm --network none --user 1000:1000 "${image}" \
            sh -c 'command -v gh && command -v moonmind && python3 -c "import httpx"'
          docker run --rm --network none --user 1000:1000 "${image}" \
            bash -lc 'command -v gh && command -v moonmind && python3 -c "import httpx"'
          # Runtime user cannot rewrite image-owned tools.
          docker run --rm --network none --user 1000:1000 "${image}" \
            sh -c 'test ! -w /opt/moonmind-tools/bin/gh && test ! -w /opt/moonmind-tools/bin/moonmind'

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-moonmind-host-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-moonmind-host-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION_TAG="${{ needs.metadata.outputs.version_tag }}"
          OPENCODE_VERSION="${{ needs.metadata.outputs.opencode_version }}"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${VERSION_TAG}" \
            -t "${IMAGE_NAME}:${OPENCODE_VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image and write build summary
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION="${{ needs.metadata.outputs.version_tag }}"
          OPENCODE_VERSION="${{ needs.metadata.outputs.opencode_version }}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{json .Manifest}}' | grep -o '"digest":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          if [ -z "${DIGEST}" ]; then
            DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          fi
          {
            echo "### omnigent-host-moonmind published"
            echo ""
            echo "- Version tag: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- OpenCode alias tag: \`${IMAGE_NAME}:${OPENCODE_VERSION}\`"
            echo "- Current build channel: \`${IMAGE_NAME}:latest\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Digest-pinned reference: \`${IMAGE_NAME}@${DIGEST}\`"
            echo ""
            echo "MoonMind resolves this tag to a digest during deployment image reconciliation."
            echo ""
            echo "#### Host Classes"
            echo "Codex, Claude Code, and OpenCode share this image through their separate Host Classes."
          } >> "${GITHUB_STEP_SUMMARY}"
