name: Release / Build omnigent-host-opencode Image

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [ main ]
    paths:
      - "services/omnigent/opencode-host/**"
      - "moonmind/omnigent/harness_platform/host_classes.py"
      - "moonmind/omnigent/harness_platform/materializers.py"
      - ".github/workflows/docker-publish-opencode-host.yml"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version to pin (must be within >=1.17.7,<1.19.0)"
        required: false
        default: "1.18.11"
        type: string

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/moonladderstudios/omnigent-host-opencode

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      opencode_version: ${{ steps.out.outputs.opencode_version }}
      rebuild_required: ${{ steps.drift.outputs.rebuild_required }}
    steps:
      - name: Generate image metadata
        id: meta
        run: |
          VERSION_TAG="${{ inputs.opencode_version || '1.18.11' }}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          IMAGE_NAME="${{ env.REGISTRY_IMAGE }}"
          IMAGE_NAME="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Resolve OpenCode version
        id: out
        run: |
          echo "opencode_version=${{ inputs.opencode_version || '1.18.11' }}" >> "$GITHUB_OUTPUT"

      - name: Detect upstream Omnigent drift
        id: drift
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          VERSION_TAG: ${{ steps.meta.outputs.version_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "rebuild_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVER_TAG="ghcr.io/omnigent-ai/omnigent-server:latest"
          HOST_TAG="${IMAGE_NAME}:${VERSION_TAG}"
          docker pull "$SERVER_TAG" >/dev/null
          if ! docker pull "$HOST_TAG" >/dev/null; then
            echo "rebuild_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVER_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$SERVER_TAG" 2>/dev/null || true)"
          SERVER_DIGEST="$(printf '%s' "$SERVER_REF" | grep -oE 'sha256:[0-9a-f]{64}' || true)"
          HOST_BUILD_DIGEST="$(docker inspect --format='{{index .Config.Labels "moonmind.omnigent.build_digest"}}' "$HOST_TAG" 2>/dev/null || true)"
          SERVER_VERSION="$(docker run --rm --entrypoint /opt/venv/bin/omnigent "$SERVER_REF" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          HOST_VERSION="$(docker run --rm --entrypoint /opt/venv/bin/omnigent "$HOST_TAG" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"

          if [ -n "$SERVER_DIGEST" ] \
            && [ "$SERVER_DIGEST" = "$HOST_BUILD_DIGEST" ] \
            && [ -n "$SERVER_VERSION" ] \
            && [ "$SERVER_VERSION" = "$HOST_VERSION" ]; then
            echo "rebuild_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild_required=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: metadata
    if: needs.metadata.outputs.rebuild_required == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Omnigent base digest
        id: base
        run: |
          set -euo pipefail
          if [ -n "${{ vars.OMNIGENT_BASE_IMAGE_REF || '' }}" ]; then
            BASE_REF="${{ vars.OMNIGENT_BASE_IMAGE_REF }}"
            if ! echo "$BASE_REF" | grep -qE '@sha256:[0-9a-f]{64}$'; then
              echo "::error::OMNIGENT_BASE_IMAGE_REF must be digest-pinned (got $BASE_REF)" >&2
              exit 1
            fi
            echo "base_image=${BASE_REF}" >> "$GITHUB_OUTPUT"
            DIGEST="$(echo "$BASE_REF" | grep -oE 'sha256:[0-9a-f]{64}')"
            echo "base_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Using pinned base from vars: ${BASE_REF}"
          else
            BASE_TAG="ghcr.io/omnigent-ai/omnigent-host:latest"
            echo "Resolving ${BASE_TAG} to digest-pinned ref..."
            # Pull and inspect to get RepoDigest (requires prior login)
            docker pull "${BASE_TAG}" >/dev/null
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${BASE_TAG}" 2>/dev/null | grep -oE 'sha256:[0-9a-f]{64}' || true)"
            if [ -z "${DIGEST}" ]; then
              # Fallback via buildx imagetools inspect (no pull)
              DIGEST="$(docker buildx imagetools inspect "${BASE_TAG}" --format '{{json .Manifest}}' 2>/dev/null | grep -oE 'sha256:[0-9a-f]{64}' | head -n1 || true)"
            fi
            if [ -z "${DIGEST}" ]; then
              echo "::error::Failed to resolve base image digest for ${BASE_TAG}" >&2
              exit 1
            fi
            # Ensure digest has prefix
            if [[ "${DIGEST}" != sha256:* ]]; then
              DIGEST="sha256:${DIGEST}"
            fi
            PINNED="ghcr.io/omnigent-ai/omnigent-host@${DIGEST}"
            echo "base_image=${PINNED}" >> "$GITHUB_OUTPUT"
            echo "base_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Resolved base to ${PINNED}"
          fi

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve paired Omnigent server build identity
        id: omnigent_build
        run: |
          set -euo pipefail
          SERVER_TAG="ghcr.io/omnigent-ai/omnigent-server:latest"
          docker pull "$SERVER_TAG" >/dev/null
          SERVER_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$SERVER_TAG" 2>/dev/null || true)"
          BUILD_DIGEST="$(printf '%s' "$SERVER_REF" | grep -oE 'sha256:[0-9a-f]{64}' || true)"
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the paired Omnigent server build identity"
            exit 1
          fi
          SERVER_VERSION="$(docker run --rm --entrypoint /opt/venv/bin/omnigent "$SERVER_REF" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          HOST_VERSION="$(docker run --rm --entrypoint /opt/venv/bin/omnigent '${{ steps.base.outputs.base_image }}' --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$SERVER_VERSION" ] || [ "$SERVER_VERSION" != "$HOST_VERSION" ]; then
            echo "::error::Omnigent server/host version mismatch: server=${SERVER_VERSION:-unknown} host=${HOST_VERSION:-unknown}"
            exit 1
          fi
          echo "server_ref=$SERVER_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$BUILD_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: meta
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ needs.metadata.outputs.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/omnigent/opencode-host/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIGENT_HOST_BASE_IMAGE=${{ steps.base.outputs.base_image }}
            OMNIGENT_BUILD_DIGEST=${{ steps.omnigent_build.outputs.digest }}
            OPENCODE_VERSION=${{ needs.metadata.outputs.opencode_version }}
            OPENCODE_MIN_VERSION=1.17.7
            OPENCODE_MAX_VERSION=1.19.0
          outputs: type=image,name=${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=opencode-${{ steps.meta.outputs.pair }}
          cache-to: type=gha,scope=opencode-${{ steps.meta.outputs.pair }},mode=max
          provenance: true
          sbom: true

      - name: Verify opencode binary in image
        run: |
          digest="${{ steps.build.outputs.digest }}"
          image="${{ steps.meta.outputs.image_name }}@${digest}"
          echo "Verifying ${image}"
          docker pull "${image}" || true
          docker run --rm "${image}" opencode --version
          docker run --rm "${image}" sh -c 'command -v opencode && opencode --version | grep -E "1\.(17|18)"'

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-opencode-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: needs.metadata.outputs.rebuild_required == 'true'
    needs:
      - metadata
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-opencode-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION_TAG="${{ needs.metadata.outputs.version_tag }}"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${VERSION_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image and write build summary
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION="${{ needs.metadata.outputs.version_tag }}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{json .Manifest}}' | grep -o '"digest":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          # Fallback to digest from manifest
          if [ -z "${DIGEST}" ]; then
            DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          fi
          {
            echo "### omnigent-host-opencode published"
            echo ""
            echo "- Version tag: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Current build channel: \`${IMAGE_NAME}:latest\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Digest-pinned reference: \`${IMAGE_NAME}@${DIGEST}\`"
            echo ""
            echo "Set \`OMNIGENT_OPENCODE_HOST_IMAGE_REF=${IMAGE_NAME}@${DIGEST}\` in deployment."
            echo ""
            echo "#### Host Class"
            echo "\`omnigent-opencode@1\` now bootstraps from this digest via \`get_opencode_host_image_ref()\`."
          } >> "${GITHUB_STEP_SUMMARY}"
