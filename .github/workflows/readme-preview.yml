name: Docs / README preview capture
on:
  push:
    branches: [docs/readme-omnigent-dark-mode]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:build
      - run: node tools/capture_readme_preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readme-dark-preview
          path: |
            readme-preview/
            tools/capture_readme_preview.mjs
          retention-days: 7
