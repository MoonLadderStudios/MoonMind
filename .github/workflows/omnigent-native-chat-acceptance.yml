name: Provider / Omnigent Native Chat Acceptance

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      server_image:
        description: "Optional digest-pinned stock Omnigent server image"
        required: false
        type: string
      ui_image:
        description: "Optional digest-pinned stock Omnigent UI image"
        required: false
        type: string
      host_image:
        description: "Optional digest-pinned stock Codex host image"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: omnigent-native-chat-acceptance
  cancel-in-progress: false

jobs:
  produce-and-publish:
    name: Produce protected journey and publish rollout gate
    runs-on: [self-hosted, linux, omnigent-provider-verification]
    environment: omnigent-provider-verification
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository and browser dependencies
        run: |
          python -m pip install -e .[tests]
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Resolve immutable stock images
        id: images
        shell: bash
        env:
          INPUT_SERVER: ${{ inputs.server_image }}
          INPUT_UI: ${{ inputs.ui_image }}
          INPUT_HOST: ${{ inputs.host_image }}
          DEFAULT_SERVER: ${{ vars.OMNIGENT_NATIVE_CHAT_SERVER_IMAGE }}
          DEFAULT_UI: ${{ vars.OMNIGENT_NATIVE_CHAT_UI_IMAGE }}
          DEFAULT_HOST: ${{ vars.OMNIGENT_NATIVE_CHAT_HOST_IMAGE }}
        run: |
          for item in server ui host; do
            input_name="INPUT_${item^^}"
            default_name="DEFAULT_${item^^}"
            value="${!input_name:-${!default_name}}"
            if [[ ! "$value" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "::error::${item} image must be configured by immutable digest"
              exit 1
            fi
            echo "${item}=${value}" >> "$GITHUB_OUTPUT"
          done
      - name: Run deterministic and protected stock-image producer
        env:
          MOONMIND_NATIVE_CHAT_ACTION_COMMAND: ${{ secrets.MOONMIND_NATIVE_CHAT_ACTION_COMMAND }}
          MOONMIND_OMNIGENT_BROWSER_STORAGE_STATE: ${{ secrets.MOONMIND_OMNIGENT_BROWSER_STORAGE_STATE }}
          OMNIGENT_API_TOKEN: ${{ secrets.OMNIGENT_API_TOKEN }}
          MOONMIND_OMNIGENT_PROVIDER_PROFILE_ID: ${{ vars.MOONMIND_OMNIGENT_PROVIDER_PROFILE_ID }}
          MOONMIND_OMNIGENT_DASHBOARD_URL: ${{ vars.MOONMIND_OMNIGENT_DASHBOARD_URL }}
        run: |
          python tools/run_native_chat_acceptance_journey.py \
            --server-image "${{ steps.images.outputs.server }}" \
            --ui-image "${{ steps.images.outputs.ui }}" \
            --host-image "${{ steps.images.outputs.host }}" \
            --commit "${{ github.sha }}" \
            --build "${{ github.sha }}" \
            --output-root artifacts/omnigent-native-chat-acceptance/input
      - name: Build the passing report from produced evidence
        run: |
          python tools/build_native_chat_acceptance.py \
            artifacts/omnigent-native-chat-acceptance/input/native-chat-acceptance-input.json \
            artifacts/omnigent-native-chat-acceptance/report.json \
            --evidence-root artifacts/omnigent-native-chat-acceptance/input/evidence \
            --expected-commit "${{ github.sha }}"
      - name: Upload independently resolvable evidence and report
        uses: actions/upload-artifact@v7
        with:
          name: omnigent-native-chat-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance
          if-no-files-found: error
          retention-days: 90
      - name: Link passing report from issue 3642
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          comment_file="${RUNNER_TEMP}/omnigent-native-chat-acceptance.md"
          {
            echo "Native Omnigent Workflow Chat acceptance gate: PASS"
            echo
            echo "- Protected producer run: ${run_url} (attempt ${{ github.run_attempt }})"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Durable matrix + report: \`omnigent-native-chat-acceptance-${{ github.run_id }}-${{ github.run_attempt }}\`"
          } > "$comment_file"
          gh issue comment 3642 --repo "${{ github.repository }}" --body-file "$comment_file"
