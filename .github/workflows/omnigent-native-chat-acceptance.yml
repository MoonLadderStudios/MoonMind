name: Provider / Omnigent Native Chat Acceptance

on:
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:
    inputs:
      server_image:
        description: "Optional digest-pinned stock Omnigent server image"
        required: false
        type: string
      ui_image:
        description: "Optional digest-pinned stock Omnigent native UI image"
        required: false
        type: string
      host_image:
        description: "Optional digest-pinned stock Omnigent host image"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: omnigent-native-chat-acceptance
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve immutable candidate identity
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.images.outputs.server }}
      ui: ${{ steps.images.outputs.ui }}
      host: ${{ steps.images.outputs.host }}
      build: ${{ steps.identity.outputs.build }}
    steps:
      - name: Resolve pinned stock images
        id: images
        shell: bash
        env:
          INPUT_SERVER: ${{ inputs.server_image }}
          INPUT_UI: ${{ inputs.ui_image }}
          INPUT_HOST: ${{ inputs.host_image }}
          DEFAULT_SERVER: ${{ vars.OMNIGENT_NATIVE_CHAT_SERVER_IMAGE }}
          DEFAULT_UI: ${{ vars.OMNIGENT_NATIVE_CHAT_UI_IMAGE }}
          DEFAULT_HOST: ${{ vars.OMNIGENT_NATIVE_CHAT_HOST_IMAGE }}
        run: |
          server="${INPUT_SERVER:-$DEFAULT_SERVER}"
          ui="${INPUT_UI:-$DEFAULT_UI}"
          host="${INPUT_HOST:-$DEFAULT_HOST}"
          for pair in "server=$server" "ui=$ui" "host=$host"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [[ ! "$value" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "::error::${name} image must be configured by immutable digest"
              exit 1
            fi
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          done
      - name: Record build identity
        id: identity
        run: echo "build=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  deterministic:
    name: Browser-to-fake-server controlling lane
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -e .[tests]
      - name: Install pinned frontend dependencies and Chromium
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Run production-boundary backend journey
        env:
          MOONMIND_HIGH_SECURITY_MODE: "1"
        run: |
          mkdir -p artifacts/omnigent-native-chat-acceptance/deterministic
          python -m pytest -q \
            tests/integration/reliability_journey/test_native_chat_acceptance_journey.py \
            tests/integration/reliability_journey/test_omnigent_browser_product_path_journey.py \
            tests/integration/omnigent/test_bridge_proxy_fake_server.py \
            tests/unit/api/routers/test_omnigent_native_ui.py \
            tests/unit/api/routers/test_omnigent_workflow_chat.py \
            tests/unit/api/routers/test_omnigent_workflow_chat_ws.py \
            tests/unit/api/routers/test_executions_linked_continuation.py \
            tests/unit/security/test_outbound_scan.py \
            tests/unit/omnigent/test_native_outbound_scan.py \
            tests/unit/omnigent/test_native_chat_rollout.py \
            tests/unit/omnigent/test_native_chat_telemetry.py \
            --junitxml=artifacts/omnigent-native-chat-acceptance/deterministic/backend-junit.xml
      - name: Run real-browser native application journey
        env:
          MOONMIND_BROWSER_ENGINES: chromium
        run: |
          npx vitest run \
            frontend/src/entrypoints/workflow-detail.test.tsx \
            frontend/src/entrypoints/WorkflowChatNative.test.tsx \
            frontend/src/features/workflow-native-chat/WorkflowNativeChatRoute.test.tsx \
            --config frontend/vite.config.ts \
            --reporter=junit \
            --outputFile=artifacts/omnigent-native-chat-acceptance/deterministic/frontend-junit.xml
          npx vitest run \
            frontend/src/browser/workflowNativeChat.browser.test.tsx \
            --config frontend/vitest.browser.config.ts \
            --reporter=junit \
            --outputFile=artifacts/omnigent-native-chat-acceptance/deterministic/browser-junit.xml
      - name: Build deterministic resolved lane
        run: |
          python tools/record_native_chat_deterministic_observations.py \
            --backend-junit artifacts/omnigent-native-chat-acceptance/deterministic/backend-junit.xml \
            --frontend-junit artifacts/omnigent-native-chat-acceptance/deterministic/frontend-junit.xml \
            --browser-junit artifacts/omnigent-native-chat-acceptance/deterministic/browser-junit.xml \
            --output-dir artifacts/omnigent-native-chat-acceptance/deterministic/evidence \
            --commit "${{ github.sha }}" \
            --build "${{ needs.candidate.outputs.build }}" \
            --server-image "${{ needs.candidate.outputs.server }}" \
            --ui-image "${{ needs.candidate.outputs.ui }}" \
            --host-image "${{ needs.candidate.outputs.host }}"
          python tools/build_native_chat_acceptance_lane.py \
            artifacts/omnigent-native-chat-acceptance/deterministic/evidence/observations.json \
            artifacts/omnigent-native-chat-acceptance/deterministic/native-chat-deterministic.json \
            --lane deterministic \
            --evidence-root artifacts/omnigent-native-chat-acceptance/deterministic/evidence \
            --expected-commit "${{ github.sha }}"
      - name: Upload deterministic lane
        uses: actions/upload-artifact@v7
        with:
          name: native-chat-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance/deterministic
          if-no-files-found: error
          retention-days: 90

  protected-live:
    name: Stock-image protected-live controlling lane
    needs: candidate
    runs-on: [self-hosted, linux, omnigent-provider-verification]
    environment: omnigent-provider-verification
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e .[tests]
      - name: Materialize browser authentication state
        env:
          BROWSER_STORAGE_STATE: ${{ secrets.MOONMIND_OMNIGENT_BROWSER_STORAGE_STATE }}
        run: python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"moonmind-native-chat-browser-state.json"; p.write_text(os.environ["BROWSER_STORAGE_STATE"], encoding="utf-8"); p.chmod(0o600)'
      - name: Run repository-owned protected-live journey
        env:
          MOONMIND_BUILD_COMMIT: ${{ github.sha }}
          MOONMIND_BUILD_ID: ${{ needs.candidate.outputs.build }}
          MOONMIND_OMNIGENT_ACTION_COMMAND: ${{ secrets.MOONMIND_OMNIGENT_ACTION_COMMAND }}
          MOONMIND_OMNIGENT_LOG_EVIDENCE: ${{ vars.MOONMIND_OMNIGENT_LOG_EVIDENCE }}
          MOONMIND_OMNIGENT_TEMPORAL_HISTORY_EVIDENCE: ${{ vars.MOONMIND_OMNIGENT_TEMPORAL_HISTORY_EVIDENCE }}
          MOONMIND_OMNIGENT_SCREENSHOT_EVIDENCE: ${{ vars.MOONMIND_OMNIGENT_SCREENSHOT_EVIDENCE }}
          MOONMIND_OMNIGENT_ARCHIVE_EVIDENCE: ${{ vars.MOONMIND_OMNIGENT_ARCHIVE_EVIDENCE }}
          MOONMIND_OMNIGENT_DASHBOARD_URL: ${{ vars.MOONMIND_OMNIGENT_DASHBOARD_URL }}
          MOONMIND_OMNIGENT_PROVIDER_PROFILE_ID: ${{ vars.MOONMIND_OMNIGENT_PROVIDER_PROFILE_ID }}
          MOONMIND_OMNIGENT_BROWSER_STORAGE_STATE: ${{ runner.temp }}/moonmind-native-chat-browser-state.json
          MOONMIND_OMNIGENT_ACCEPTANCE_CANARY_TOKEN: ${{ secrets.MOONMIND_OMNIGENT_ACCEPTANCE_CANARY_TOKEN }}
        run: |
          python tools/run_omnigent_live_conformance.py \
            --mode native-chat \
            --server-image "${{ needs.candidate.outputs.server }}" \
            --ui-image "${{ needs.candidate.outputs.ui }}" \
            --host-image "${{ needs.candidate.outputs.host }}" \
            --output-dir artifacts/omnigent-native-chat-acceptance/protected-live
      - name: Upload protected-live lane
        uses: actions/upload-artifact@v7
        with:
          name: native-chat-protected-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance/protected-live
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Validate and publish the native Workflow Chat rollout gate
    needs: [candidate, deterministic, protected-live]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install report dependencies
        run: python -m pip install -e .
      - name: Download deterministic lane
        uses: actions/download-artifact@v8
        with:
          name: native-chat-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance/deterministic
      - name: Download protected-live lane
        uses: actions/download-artifact@v8
        with:
          name: native-chat-protected-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance/protected-live
      - name: Merge lanes and build native chat acceptance report
        run: |
          python tools/merge_native_chat_acceptance_lanes.py \
            artifacts/omnigent-native-chat-acceptance/deterministic/native-chat-deterministic.json \
            artifacts/omnigent-native-chat-acceptance/protected-live/native-chat-protected-live.json \
            artifacts/omnigent-native-chat-acceptance/report.json \
            --expected-commit "${{ github.sha }}"
      - name: Upload passing report
        uses: actions/upload-artifact@v7
        with:
          name: omnigent-native-chat-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/omnigent-native-chat-acceptance/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Link passing report from issue 3642
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_artifact="omnigent-native-chat-acceptance-${{ github.run_id }}-${{ github.run_attempt }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment 3642 --repo "${{ github.repository }}" --body \
            "Native Omnigent Workflow Chat acceptance: PASS. Run: ${run_url}; commit: ${{ github.sha }}; report: ${report_artifact}."
