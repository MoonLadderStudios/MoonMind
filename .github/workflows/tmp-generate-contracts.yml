name: tmp-generate-contracts
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update'
        required: true
        default: 'moonmind-job-e6e3c5d2'
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install OpenAPI TypeScript generator
        run: bash tools/install_openapi_typescript.sh
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e .
      - name: Regenerate contracts
        run: npm run api:types
      - name: Commit and push if changed
        run: |
          git config user.name "MoonMind Resolver"
          git config user.email "resolver@moonmind.local"
          git add frontend/src/generated/openapi.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Regenerate frontend OpenAPI contracts for #4249"
            git push origin HEAD:${{ inputs.branch }}
          fi
