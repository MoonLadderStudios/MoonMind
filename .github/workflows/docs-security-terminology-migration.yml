name: Documentation security terminology migration

on:
  push:
    branches:
      - docs/security-positioning
    paths:
      - .github/workflows/docs-security-terminology-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out terminology branch
        uses: actions/checkout@v4
        with:
          ref: docs/security-positioning
          fetch-depth: 0

      - name: Apply final editorial replacements and audit terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              "docs/DocsReview.md": [
                  ("authority/safety/lifecycle boundaries", "authority/security/lifecycle boundaries"),
                  ("candidate/promotion/terminal-evidence safety", "candidate/promotion/terminal-evidence integrity"),
                  ("cost/safety tradeoff", "cost/risk tradeoff"),
                  ("skill-projection safety", "skill-projection integrity"),
              ],
              "docs/ManagedAgents/ManagedRuntimeCleanup.md": [
                  ("**Shared-checkout safety.**", "**Shared-checkout protection.**"),
                  ("path safety", "path confinement"),
              ],
              "docs/Omnigent/OmnigentFaultInjectionSuite.md": [
                  ("historical-read safety", "historical-read integrity"),
              ],
              "docs/Observability/MetricsAndDashboards.md": [
                  ("safety/intervention", "security/intervention"),
              ],
              "docs/Memory/MemoryResearch.md": [
                  ("auditability + safety", "auditability + security"),
                  ("safety/compliance hurdles", "security/compliance hurdles"),
                  ("Safety/guardrails", "Security/guardrails"),
              ],
              "AGENTS.md": [
                  ("safe defaults", "secure defaults"),
                  ("safe-by-default configuration", "restrictive-by-default configuration"),
                  ("when that alias is safe", "when that alias is conflict-free"),
                  ("safe, reviewable handoff", "bounded, reviewable handoff"),
              ],
              "CLAUDE.md": [
                  ("safe defaults", "secure defaults"),
                  ("safe-by-default configuration", "restrictive-by-default configuration"),
                  ("when that alias is safe", "when that alias is conflict-free"),
                  ("safe, reviewable handoff", "bounded, reviewable handoff"),
              ],
              "GEMINI.md": [
                  ("safe defaults", "secure defaults"),
                  ("safe-by-default configuration", "restrictive-by-default configuration"),
                  ("when that alias is safe", "when that alias is conflict-free"),
                  ("safe, reviewable handoff", "bounded, reviewable handoff"),
              ],
          }

          changed = []
          for relative_path, pairs in replacements.items():
              path = Path(relative_path)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(relative_path)

          def prose_segments(path: Path):
              in_fence = False
              fence = ""
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith("```") or stripped.startswith("~~~"):
                      marker = stripped[:3]
                      if not in_fence:
                          in_fence = True
                          fence = marker
                      elif marker == fence:
                          in_fence = False
                          fence = ""
                      continue
                  if in_fence:
                      continue
                  prose = "".join(re.split(r"(`+[^`]*`+)", line)[::2])
                  prose = re.sub(r"(?<=\]\()[^)]+(?=\))", "", prose)
                  yield line_number, line, prose

          markdown_files = [
              p for p in Path(".").rglob("*.md")
              if ".git" not in p.parts
          ]
          forbidden = []
          safe_usage = []
          for path in markdown_files:
              for line_number, line, prose in prose_segments(path):
                  check = re.sub(r"\btype[- ]safety\b", "", prose, flags=re.IGNORECASE)
                  check = re.sub(r"\S*(?:/|_|\.)(?:\S*Safety\S*|\S*safety\S*)", "", check)
                  if re.search(r"\b(?:safety|safer)\b", check, re.IGNORECASE):
                      forbidden.append(f"{path}:{line_number}: {line.strip()}")
                  if re.search(r"\b(?:safe|safely|unsafe)\b", prose, re.IGNORECASE):
                      safe_usage.append(f"{path}:{line_number}: {line.strip()}")

          print("Updated files:")
          for path in changed:
              print(f"- {path}")
          if forbidden:
              raise SystemExit(
                  "Remaining non-technical safety/safer terminology:\n" + "\n".join(forbidden)
              )
          print("No non-technical safety/safer terminology remains in Markdown prose.")
          print(f"Remaining safe/safely/unsafe prose usages for editorial review: {len(safe_usage)}")
          for item in safe_usage:
              print(item)
          PY

      - name: Commit final editorial replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CLAUDE.md GEMINI.md docs
          if git diff --cached --quiet; then
            echo "No final replacements were needed."
            exit 0
          fi
          git commit -m "docs: complete security terminology audit"
          git push origin HEAD:docs/security-positioning
