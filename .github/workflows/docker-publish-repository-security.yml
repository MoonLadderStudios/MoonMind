name: Release / Repository Security Image

on:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: [main]
    paths:
      - "services/repository-security/**"
      - "tools/ci/*repository_security_image*.py"
      - "moonmind/security/repository_scanner*.py"
      - "moonmind/security/scanner_feeds.py"
      - "moonmind/security/image_assessment*.py"
      - "moonmind/security/assessments.py"
      - "moonmind/schemas/**"
      - "moonmind/provider_profiles/model_tiers.py"
      - "moonmind/utils/logging.py"
      - ".github/workflows/docker-publish-repository-security.yml"
  pull_request:
    paths:
      - "services/repository-security/**"
      - "tools/ci/*repository_security_image*.py"
      - "tests/unit/tools/test_repository_security_image.py"
      - "moonmind/security/repository_scanner*.py"
      - "moonmind/security/scanner_feeds.py"
      - "moonmind/security/image_assessment*.py"
      - ".github/workflows/docker-publish-repository-security.yml"
  workflow_dispatch:
    inputs:
      opengrep_version:
        description: "Opengrep release override; omitted selects current stable"
        type: string
      gitleaks_version:
        description: "Gitleaks release override; omitted selects current stable"
        type: string
      trivy_version:
        description: "Trivy release override; omitted selects current stable"
        type: string
      base_image:
        description: "Compatible Python/glibc base override"
        type: string
        default: "python:3.12-slim-bookworm"

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/moonladderstudios/repository-security

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test resolution, verification failure and promotion behavior
        run: |
          python -m pip install pytest 'pydantic>=2.12.5,<2.15.0'
          python -m pytest --confcutdir=tests/unit/tools tests/unit/tools/test_repository_security_image.py
      - name: Resolve current stable inputs once for both architectures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENGREP_VERSION: ${{ inputs.opengrep_version }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
          TRIVY_VERSION: ${{ inputs.trivy_version }}
          BASE_IMAGE: ${{ inputs.base_image || 'python:3.12-slim-bookworm' }}
        run: |
          python -m tools.ci.repository_security_image resolve \
            --opengrep-version "$OPENGREP_VERSION" --gitleaks-version "$GITLEAKS_VERSION" \
            --trivy-version "$TRIVY_VERSION" --base-image "$BASE_IMAGE" --output evidence/inputs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-security-inputs
          path: evidence/

  qualify:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-security-inputs
          path: evidence
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate upstream artifacts and stage minimal runtime
        run: |
          python -m tools.ci.repository_security_image prepare --inputs evidence/inputs.json \
            --architecture '${{ matrix.architecture }}' --destination services/repository-security/resolved \
            --evidence evidence/upstream
          python -m tools.ci.repository_security_image verification-negatives \
            --inputs evidence/inputs.json --architecture '${{ matrix.architecture }}' --evidence evidence/upstream
      - name: Build with resolved base provenance
        run: |
          BASE_IMAGE=$(python -c 'import json; print(json.load(open("evidence/inputs.json"))["baseImage"])')
          docker pull "$BASE_IMAGE"
          BASE_IDENTITY=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")
          docker buildx build --load --pull --platform 'linux/${{ matrix.architecture }}' \
            --build-arg "SECURITY_BASE_IMAGE=$BASE_IDENTITY" --build-arg "SECURITY_BASE_IDENTITY=$BASE_IDENTITY" \
            --metadata-file evidence/build.json --tag repository-security:qualification \
            --file services/repository-security/Dockerfile .
      - name: Exercise real independent scanners, admitted runner and SBOM
        run: |
          sudo --preserve-env=GITHUB_SHA python3 -m tools.ci.qualify_repository_security_image \
            --image repository-security:qualification --evidence evidence/runtime
      - name: Exercise automatic update success and preservation on failure
        run: python -m tools.ci.test_repository_security_image_updates --evidence evidence/update
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish qualified candidate without changing the default
        if: github.event_name != 'pull_request'
        env:
          CANDIDATE_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: |
          docker tag repository-security:qualification "$REGISTRY_IMAGE:$CANDIDATE_TAG"
          docker push "$REGISTRY_IMAGE:$CANDIDATE_TAG"
          docker image inspect "$REGISTRY_IMAGE:$CANDIDATE_TAG" > evidence/published.json
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('evidence/runtime/qualification.json')
          record = json.loads(path.read_text())
          record['image'] = json.loads(Path('evidence/published.json').read_text())[0]['RepoDigests'][0]
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Retain original errors, inventory, signatures, source, SBOM and qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-security-${{ matrix.architecture }}
          path: evidence/
          retention-days: 90

  promote:
    needs: [resolve, qualify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repository-security-*
          path: qualified
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both qualified architectures in one default manifest update
        run: |
          python -m tools.ci.repository_security_image promote --image "$REGISTRY_IMAGE" --records \
            qualified/repository-security-amd64/runtime/qualification.json \
            qualified/repository-security-arm64/runtime/qualification.json
          docker buildx imagetools inspect "$REGISTRY_IMAGE:latest" > publication.txt
          cat publication.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-security-publication
          path: publication.txt
