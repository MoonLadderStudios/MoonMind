name: CI / Supplied App Image Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-image-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-supplied-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/pytest-unit-tests.yml
