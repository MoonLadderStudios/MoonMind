name: Security terminology editorial cleanup

on:
  push:
    branches:
      - docs/security-positioning
    paths:
      - .github/workflows/docs-security-editorial-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out terminology branch
        uses: actions/checkout@v4
        with:
          ref: docs/security-positioning
          fetch-depth: 0

      - name: Apply reviewed editorial corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              ".agents/skills/batch-dependabot-resolver/SKILL.md": [
                  ("same child `pr-resolver` payload shape, fork/cross-repo security, runtime", "same child `pr-resolver` payload shape, fork and cross-repository protections, runtime"),
              ],
              ".agents/skills/document-health-review/SKILL.md": [
                  ("agent-security reviews", "AI-agent security reviews"),
              ],
              ".agents/skills/remediate-issue/SKILL.md": [
                  ("every safe verifier gap", "every eligible verifier gap"),
                  ("If a gap is unauthorized, untrusted, or ambiguous, authority-sensitive, or blocked by the environment", "If addressing a gap would be unauthorized, untrusted, ambiguous, authority-sensitive, or blocked by the environment"),
              ],
              "AGENTS.md": [
                  ("reserve opt-in defaults for genuine authority, credential, billing, or irreversible security boundaries", "reserve opt-in defaults for genuine authority, credential, billing, security, or irreversible-action boundaries"),
                  ("Reserve hard blockers for unauthorized, untrusted, or ambiguous, authority-sensitive, credential-sensitive, billing-relevant, source-authority, or less-constrained execution paths.", "Reserve hard blockers for actions that are unauthorized, untrusted, ambiguous, authority-sensitive, credential-sensitive, billing-relevant, uncertain in source authority, or less constrained."),
              ],
              "docs/Development/BackendTestSelection.md": [
                  ("The selector, deployment-integrity validation, and the generated-contract detector", "The selector, deployment validation, and the generated-contract detector"),
                  ("AgentSession deployment-integrity validation", "AgentSession deployment validation"),
                  ("In CI, deployment-integrity validation", "In CI, deployment validation"),
                  ("Pull request CI is impact-aware. Security paths are intentionally broader:", "Pull request CI is impact-aware. Full-verification paths are intentionally broader:"),
                  ("three high-risk verification paths", "three full-verification paths"),
              ],
              "docs/Development/PreCommitWorkflow.md": [
                  ("AgentSession deployment-integrity validation", "AgentSession deployment validation"),
                  ("The selector, deployment-integrity validation, and the generated-contract detector", "The selector, deployment validation, and the generated-contract detector"),
              ],
              "docs/DocsReview.md": [
                  ("[ManagedAgents/AgentSessionDeploymentSafetyCutover.md](@@MM_PROTECTED_0@@)", "[ManagedAgents/AgentSessionDeploymentSafetyCutover.md](ManagedAgents/AgentSessionDeploymentSafetyCutover.md)"),
                  ("[Temporal/TemporalTypeSafety.md](@@MM_PROTECTED_0@@)", "[Temporal/TemporalTypeSafety.md](Temporal/TemporalTypeSafety.md)"),
              ],
              "docs/ExternalAgents/AddingExternalProvider.md": [
                  ("preserve idempotency and retry security", "preserve idempotency and retry correctness"),
              ],
              "docs/ManagedAgents/AgentSessionDeploymentSafetyCutover.md": [
                  ("The deployment-integrity gate expects this file", "The deployment validation gate expects this file"),
              ],
              "docs/ManagedAgents/ClaudeCodeManagedSessions.md": [
                  ("### 2.4 Model deterministic and non-deterministic security controls explicitly", "### 2.4 Model deterministic and classifier-based policy controls explicitly"),
                  ("skip permission prompts and security checks", "skip permission prompts and policy checks"),
                  ("unauthorized, untrusted, or ambiguous actions are checked by a classifier path", "higher-risk or ambiguous actions are checked by a classifier path"),
                  ("source-control security expectations", "source-control integrity expectations"),
              ],
              "docs/ManagedAgents/ManagedRuntimeCleanup.md": [
                  ("retention policy, security gates, deletion authority", "retention policy, deletion gates, deletion authority"),
                  ("**Safe working default.**", "**Protective working default.**"),
                  ("live Docker security gates", "live Docker protection gates"),
                  ("ownership and security semantics", "ownership and deletion-protection semantics"),
                  ("### 8.8 Security gates", "### 8.8 Deletion gates"),
                  ("All security gates pass", "All deletion gates pass"),
              ],
              "docs/MoonMindArchitecture.md": [
                  ("while adding resiliency, security, context delivery", "while adding resilience, security, context delivery"),
              ],
              "docs/Omnigent/OmnigentAdapter.md": [
                  ("bounded security-framed first message", "bounded policy-framed first message"),
              ],
              "docs/Omnigent/OmnigentFaultInjectionSuite.md": [
                  ("**Fencing security**", "**Fencing integrity**"),
                  ("**Lease security**", "**Lease ownership**"),
                  ("**Cleanup security**", "**Cleanup protection**"),
                  ("**Historical-read security**", "**Historical-read integrity**"),
                  ("**Compatibility security**", "**Compatibility enforcement**"),
                  ("**Secret security**", "**Secret confidentiality**"),
              ],
              "docs/Omnigent/OmnigentLifecycleReconciler.md": [
                  ("## 6. Diagnostics security", "## 6. Diagnostic confidentiality"),
              ],
              "docs/Rag/WorkflowRag.md": [
                  ("adds security framing that treats retrieved text", "adds untrusted-content framing that treats retrieved text"),
                  ("bounded, security-framed `context_text`", "bounded, policy-framed `context_text`"),
                  ("### 10.2 Prompt security", "### 10.2 Prompt-injection boundary"),
                  ("preserve a security boundary that tells the model", "preserve a trust boundary that tells the model"),
              ],
              "docs/Security/SettingsLocalFirstBringUp.md": [
                  ("## 6. Partial-restore security", "## 6. Partial-restore integrity"),
              ],
              "docs/Steps/StepExecutionsAndCheckpointing.md": [
                  ("4. Replay security:", "4. Replay compatibility:"),
              ],
              "docs/Temporal/IntegrationsMonitoringDesign.md": [
                  ("* polling is a fallback or fallback guard", "* polling is a bounded fallback"),
              ],
              "docs/Temporal/TemporalArchitecture.md": [
                  ("### 6.10 Type security is part of the architecture", "### 6.10 Type safety is part of the architecture"),
              ],
              "docs/Temporal/TemporalSignalsSystem.md": [
                  ("more secure replay compatibility", "more reliable replay compatibility"),
                  ("ensuring security without polluting the new codebase", "preserving compatibility without polluting the new codebase"),
              ],
              "docs/Temporal/TemporalTypeSafety.md": [
                  ("Type security", "Type safety"),
              ],
              "docs/Temporal/WorkflowTypeCatalogAndLifecycle.md": [
                  ("giant top-level execution timeouts for security", "giant top-level execution timeouts for correctness and recoverability"),
              ],
              "docs/UI/SettingsPage.md": [
                  ("unless a approved specific mapping exists", "unless an approved specific mapping exists"),
                  ("secret-security decisions", "secret-handling decisions"),
              ],
              "docs/UI/TypeScriptSystem.md": [
                  ("Improve security when working with API responses, forms, page state, polling, and mutations.", "Improve correctness when working with API responses, forms, page state, polling, and mutations."),
                  ("improves maintainability and security immediately", "improves maintainability and correctness immediately"),
              ],
              "docs/UI/WorkflowConsoleArchitecture.md": [
                  ("temporary fallback heuristics only as an implementation fallback guard", "temporary fallback heuristics only as a compatibility fallback"),
              ],
              "docs/Workflows/CheckpointBranchSystem.md": [
                  ("## 14. Security and security", "## 14. Security and isolation"),
                  ("### 15.4 Security previews", "### 15.4 Risk and authority previews"),
                  ("publication security", "publication authorization"),
              ],
              "docs/Workflows/SkillAndPlanContracts.md": [
                  ("within security limits", "within policy limits"),
                  ("* Security: avoids surprise changes from concurrent deployments.", "* Integrity: avoids surprise changes from concurrent deployments."),
              ],
              "docs/Workflows/WorkflowRemediation.md": [
                  ("### 13.6 Continue-As-New security", "### 13.6 Continue-As-New state integrity"),
              ],
          }

          changed = []
          missing = []
          for relative_path, pairs in replacements.items():
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      missing.append(f"{relative_path}: {old}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(relative_path)

          if missing:
              raise SystemExit("Expected text was not found:\n" + "\n".join(missing))

          all_markdown = "\n".join(
              path.read_text(encoding="utf-8")
              for path in Path(".").rglob("*.md")
              if ".git" not in path.parts
          )
          forbidden = [
              "@@MM_PROTECTED_",
              "Type security",
              "retry security",
              "Security and security",
              "fallback or fallback guard",
              "security-framed",
          ]
          remaining = [value for value in forbidden if value in all_markdown]
          if remaining:
              raise SystemExit("Editorial audit still found: " + ", ".join(remaining))

          print("Updated files:")
          for relative_path in changed:
              print(f"- {relative_path}")
          PY

      - name: Commit reviewed corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents AGENTS.md docs
          git commit -m "docs: refine security terminology"
          git push origin HEAD:docs/security-positioning
