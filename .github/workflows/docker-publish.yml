name: Release / Build App Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Generate image metadata
        id: meta
        run: |
          VERSION_TAG="$(date -u +'%Y%m%d').${{ github.run_number }}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          IMAGE_NAME="${{ env.REGISTRY_IMAGE }}"
          IMAGE_NAME="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize pinned Omnigent verifier source
        run: git submodule update --init --depth 1 -- omnigent

      - name: Set up Python
        if: matrix.platform == 'linux/amd64'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: matrix.platform == 'linux/amd64'
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libcairo2-dev pkg-config

      - name: Cache pip dependencies
        if: matrix.platform == 'linux/amd64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        if: matrix.platform == 'linux/amd64'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Setup Node.js
        if: matrix.platform == 'linux/amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Check frontend and generated contracts
        if: matrix.platform == 'linux/amd64'
        run: |
          npm ci
          npm run ui:typecheck
          npm run ui:lint
          npm run ui:test
          npm run contracts:check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ needs.metadata.outputs.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache BuildKit mount directories
        id: buildkit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-cache-mounts
          key: ${{ runner.os }}-${{ steps.meta.outputs.pair }}-buildkit-cache-mounts-${{ hashFiles('api_service/Dockerfile', 'package-lock.json', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.meta.outputs.pair }}-buildkit-cache-mounts-

      - name: Restore BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/buildkit-cache-mounts
          dockerfile: api_service/Dockerfile
          skip-extraction: ${{ steps.buildkit-cache.outputs.cache-hit }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./api_service/Dockerfile
          target: api-runtime
          build-args: |
            MOONMIND_BUILD_ID=${{ needs.metadata.outputs.version_tag }}
            MOONMIND_BUILD_SHA=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ steps.meta.outputs.pair }}
          cache-to: type=gha,scope=build-${{ steps.meta.outputs.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-moonmind-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    # Serialize the main-tip check and tagging so two publishes cannot
    # interleave and leave `latest` on the older build.
    concurrency:
      group: app-image-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-moonmind-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ needs.metadata.outputs.image_name }}
          VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: |
          TAGS=(-t "${IMAGE_NAME}:${VERSION_TAG}" -t "${IMAGE_NAME}:sha-${GITHUB_SHA}")
          # `latest` is what host updates install, so only a build of the
          # current main tip may move it: a manual dispatch from another
          # branch, or an older main build finishing late, must not.
          MAIN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${MAIN_HEAD}" = "${GITHUB_SHA}" ]; then
            TAGS+=(-t "${IMAGE_NAME}:latest")
            echo "moved_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "moved_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not moving latest: ${GITHUB_SHA} on ${GITHUB_REF} is not the main tip (${MAIN_HEAD})"
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image and write build summary
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION="${{ needs.metadata.outputs.version_tag }}"

          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::App image ${IMAGE_NAME}:${VERSION} is not published" >&2
            exit 1
          fi

          # `latest` is the current build channel; `stable` is moved later by
          # the Release / Promote Stable workflow.
          {
            echo "### App image published"
            echo ""
            echo "- Version tag: \`${IMAGE_NAME}:${VERSION}\`"
            if [ "${{ steps.manifest.outputs.moved_latest }}" = "true" ]; then
              echo "- Moved \`${IMAGE_NAME}:latest\` to this build"
            else
              echo "- \`${IMAGE_NAME}:latest\` not moved: this build is not the current main tip"
            fi
            echo "- Digest: \`${DIGEST}\`"
            echo "- Digest-pinned reference: \`${IMAGE_NAME}:${VERSION}@${DIGEST}\`"
            echo ""
            echo "To promote this build, run **Actions → Release / Promote Stable** with image \`app\` and source tag \`${VERSION}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
