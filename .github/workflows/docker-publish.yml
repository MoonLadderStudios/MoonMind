name: Release / Build App Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Generate image metadata
        id: meta
        run: |
          VERSION_TAG="$(date -u +'%Y%m%d').${{ github.run_number }}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          IMAGE_NAME="${{ env.REGISTRY_IMAGE }}"
          IMAGE_NAME="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize pinned Omnigent verifier source
        run: git submodule update --init --depth 1 -- omnigent

      - name: Set up Python
        if: matrix.platform == 'linux/amd64'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: matrix.platform == 'linux/amd64'
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libcairo2-dev pkg-config

      - name: Cache pip dependencies
        if: matrix.platform == 'linux/amd64'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        if: matrix.platform == 'linux/amd64'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Setup Node.js
        if: matrix.platform == 'linux/amd64'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check frontend and generated contracts
        if: matrix.platform == 'linux/amd64'
        run: |
          npm ci
          npm run ui:typecheck
          npm run ui:lint
          npm run ui:test
          npm run contracts:check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ needs.metadata.outputs.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache BuildKit mount directories
        id: buildkit-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/buildkit-cache-mounts
          key: ${{ runner.os }}-${{ steps.meta.outputs.pair }}-buildkit-cache-mounts-${{ hashFiles('api_service/Dockerfile', 'package-lock.json', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.meta.outputs.pair }}-buildkit-cache-mounts-

      - name: Restore BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/buildkit-cache-mounts
          dockerfile: api_service/Dockerfile
          skip-extraction: ${{ steps.buildkit-cache.outputs.cache-hit }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api_service/Dockerfile
          target: api-runtime
          build-args: |
            MOONMIND_BUILD_ID=${{ needs.metadata.outputs.version_tag }}
            MOONMIND_BUILD_SHA=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ steps.meta.outputs.pair }}
          cache-to: type=gha,scope=build-${{ steps.meta.outputs.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-moonmind-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  assemble:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    outputs:
      image_ref: ${{ steps.manifest.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-moonmind-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ needs.metadata.outputs.image_name }}
          VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: |
          set -euo pipefail
          TAGS=(-t "${IMAGE_NAME}:${VERSION_TAG}" -t "${IMAGE_NAME}:sha-${GITHUB_SHA}")
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION_TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Inspect image and write build summary
        run: |
          IMAGE_NAME="${{ needs.metadata.outputs.image_name }}"
          VERSION="${{ needs.metadata.outputs.version_tag }}"

          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::App image ${IMAGE_NAME}:${VERSION} is not published" >&2
            exit 1
          fi

          # `latest` is the current build channel; `stable` is moved later by
          # the Release / Promote Stable workflow.
          {
            echo "### App image published"
            echo ""
            echo "- Version tag: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Default channel waits for required CI and installed-artifact journeys"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Digest-pinned reference: \`${IMAGE_NAME}:${VERSION}@${DIGEST}\`"
            echo ""
            echo "To promote this build, run **Actions → Release / Promote Stable** with image \`app\` and source tag \`${VERSION}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  qualify:
    needs: assemble
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/pytest-unit-tests.yml
    with:
      candidate_image: ${{ needs.assemble.outputs.image_ref }}

  qualify-migrations:
    needs: assemble
    permissions:
      contents: read
    uses: ./.github/workflows/alembic-migration-gate.yml

  publish-latest:
    needs:
      - metadata
      - assemble
      - qualify
      - qualify-migrations
    runs-on: ubuntu-latest
    # Preserve ordering when multiple qualified builds finish out of order.
    concurrency:
      group: app-image-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Publish the qualified default channel
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ needs.metadata.outputs.image_name }}
          CANDIDATE_IMAGE: ${{ needs.assemble.outputs.image_ref }}
        run: |
          set -euo pipefail
          MAIN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${MAIN_HEAD}" != "${GITHUB_SHA}" ]; then
            echo "::notice::Not moving latest: ${GITHUB_SHA} on ${GITHUB_REF} is not the main tip (${MAIN_HEAD})"
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE_NAME}:latest" "$CANDIDATE_IMAGE"
          echo "Qualified default image: \`${CANDIDATE_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
