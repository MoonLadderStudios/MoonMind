version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # There is no root Dockerfile; list each directory whose Dockerfile pins a
  # literal base image. The Omnigent host Dockerfiles take their base image
  # from a build argument, which Dependabot cannot update.
  - package-ecosystem: "docker"
    directories:
      - "/api_service"
      - "/deploy/controller"
      - "/deploy/moonmind-controller"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
