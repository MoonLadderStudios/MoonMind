    depends_on:
      codex-auth-init:
        condition: service_completed_successfully
    restart: "no"

  omnigent-host-codex:
    profiles: ["omnigent-host-codex"]
    # Shared host image (MoonLadderStudios/MoonMind#3834): must stay identical
    # to `x-omnigent-static-host` image and to `omnigent-host-claude` image.
    image: ${OMNIGENT_SHARED_HOST_IMAGE_REF:-${OMNIGENT_SHARED_HOST_IMAGE:-ghcr.io/moonladderstudios/omnigent-host-moonmind}:${OMNIGENT_SHARED_HOST_IMAGE_TAG:-1.18.11}}
    hostname: omnigent-host-codex
    user: "1000:1000"
    working_dir: /home/app
    cpus: ${OMNIGENT_HOST_CPU_LIMIT:-2}
    mem_limit: ${OMNIGENT_HOST_MEMORY_LIMIT:-4096m}
    pids_limit: ${OMNIGENT_HOST_PIDS_LIMIT:-256}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${OMNIGENT_HOST_TMPFS_LIMIT:-256m}
    stop_grace_period: ${OMNIGENT_HOST_STOP_GRACE_SECONDS:-20}s
    labels:
      moonmind.effective_launch_ref: ${OMNIGENT_EFFECTIVE_LAUNCH_REF:-bootstrap}
      moonmind.capture_required: "true"
      moonmind.capture_retention_days: ${OMNIGENT_CAPTURE_RETENTION_DAYS:-30}
      moonmind.cleanup_mode: drain
      moonmind.control_capabilities: ${OMNIGENT_CONTROL_CAPABILITIES:-interrupt,terminate,clear_context}
      moonmind.egress.profile: ${OMNIGENT_EGRESS_PROFILE_REF:-unattested}
      moonmind.egress.profile_digest: ${OMNIGENT_EGRESS_PROFILE_DIGEST:-unattested}
      moonmind.egress.applied_rule_digest: ${OMNIGENT_EGRESS_APPLIED_RULE_DIGEST:-unattested}
    entrypoint: ["/opt/moonmind/start-omnigent-host.sh"]
    environment:
      HTTP_PROXY: http://omnigent-egress-proxy:3129
      HTTPS_PROXY: http://omnigent-egress-proxy:3129
      http_proxy: http://omnigent-egress-proxy:3129
      https_proxy: http://omnigent-egress-proxy:3129
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      OMNIGENT_RUNNER_ENV_PASSTHROUGH: HTTP_PROXY,HTTPS_PROXY,http_proxy,https_proxy,NO_PROXY,no_proxy,MOONMIND_ACTIVE_SKILLS_DIR
      PATH: /opt/moonmind-tools/bin:${OMNIGENT_HOST_BASE_PATH:-/opt/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin}
      MOONMIND_ACTIVE_SKILLS_DIR: /opt/moonmind-skills
      HOME: /home/app
      # Runtime-specific selection (MoonLadderStudios/MoonMind#3834): the only
      # pack/materializer difference between the static rows. The generic
      # entrypoint resolves all other behavior through these trusted refs.
      MOONMIND_OMNIGENT_RUNTIME_PACK_REF: codex-native-pack@1
      MOONMIND_OMNIGENT_CREDENTIAL_MATERIALIZER_REF: codex-oauth-home@1
      CODEX_HOME: /home/app/.codex
      CODEX_CONFIG_HOME: /home/app/.codex
      CODEX_CONFIG_PATH: /home/app/.codex/config.toml
      CODEX_VOLUME_PATH: /home/app/.codex
      CODEX_CREDENTIAL_GENERATION: ${CODEX_CREDENTIAL_GENERATION:-1}
      OMNIGENT_SERVER_URL: http://omnigent:8000
      OMNIGENT_EXECUTION_TIMEOUT_SECONDS: ${OMNIGENT_HOST_TIMEOUT_SECONDS:-5400}
      OMNIGENT_EXECUTION_TIMEOUT_OWNER: temporal_workflow
      OMNIGENT_CAPTURE_OWNER: moonmind_bridge
      OMNIGENT_CAPTURE_RETENTION_DAYS: ${OMNIGENT_CAPTURE_RETENTION_DAYS:-30}
    volumes:
      - omnigent-host-codex-state:/home/app/.omnigent
      - omnigent-host-artifacts:/artifacts
      - omnigent-host-cache:/home/app/.cache
      - omnigent-tools:/opt/moonmind-tools:ro
      - ${OMNIGENT_ACTIVE_SKILLS_DIR:-./omnigent_workspaces/.moonmind/skills_active}:/opt/moonmind-skills:ro
      - ./services/omnigent/scripts/moonmind-tools.sh:/etc/profile.d/moonmind-tools.sh:ro
      - codex_auth_volume:/home/app/.codex
      - ./services/omnigent/scripts:/opt/moonmind:ro
      - ${OMNIGENT_RUN_WORKSPACE:-./omnigent_workspaces/run}:/workspaces/run
    depends_on:
      omnigent:
        condition: service_started
      omnigent-host-codex-init:
        condition: service_completed_successfully
      omnigent-tools-init:
        condition: service_completed_successfully
      sandbox-egress-proxy:
        condition: service_healthy
    networks:
      - omnigent-egress-network
    restart: unless-stopped
    healthcheck:
      # Generic static-host health contract (MoonLadderStudios/MoonMind#3834):
      # identical shape for both rows; pack-specific probing happens inside
      # check-omnigent-host.sh via MOONMIND_OMNIGENT_RUNTIME_PACK_REF.
      test:
        [
          "CMD-SHELL",
          "/opt/moonmind/check-omnigent-host.sh && /opt/moonmind/check-runner-projections.sh",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  init-db:
    image: ${MOONMIND_IMAGE:-ghcr.io/moonladderstudios/moonmind:latest}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-moonmind-api-db}:5432/${POSTGRES_DB:-moonmind}
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION=${MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION:-1}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./moonmind:/app/moonmind:ro
      - ./tools:/app/tools:ro
      - ./api_service:/app/api_service:ro
      - ./docs:/app/docs:ro
      - moonmind_secrets:/app/var/secrets
      - ./init_db:/app/init_db
    command: sh /app/init_db/init_db_entrypoint.sh
    networks:
      - control-plane-network
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  omnigent-db-init:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-password}
      - PGDATABASE=${POSTGRES_DB:-moonmind}
      - OMNIGENT_POSTGRES_USER=${OMNIGENT_POSTGRES_USER:-omnigent}
      - OMNIGENT_POSTGRES_PASSWORD=${OMNIGENT_POSTGRES_PASSWORD:-omnigent}
      - OMNIGENT_POSTGRES_DB=${OMNIGENT_POSTGRES_DB:-omnigent}
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        quote_ident() { printf '%s' "$$1" | sed 's/"/""/g'; }
        quote_literal() { printf '%s' "$$1" | sed "s/'/''/g"; }

        role_sql="\"$$(quote_ident "$$OMNIGENT_POSTGRES_USER")\""
        db_sql="\"$$(quote_ident "$$OMNIGENT_POSTGRES_DB")\""
        password_sql="'$$(quote_literal "$$OMNIGENT_POSTGRES_PASSWORD")'"
        role_literal="'$$(quote_literal "$$OMNIGENT_POSTGRES_USER")'"
        db_literal="'$$(quote_literal "$$OMNIGENT_POSTGRES_DB")'"

        role_exists="$$(psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = $$role_literal")"
        if [ "$$role_exists" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE $$role_sql LOGIN PASSWORD $$password_sql"
        fi
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE $$role_sql PASSWORD $$password_sql"

        db_exists="$$(psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = $$db_literal")"
        if [ "$$db_exists" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE $$db_sql OWNER $$role_sql"
        fi

        psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE $$db_sql TO $$role_sql"
        psql -v ON_ERROR_STOP=1 --dbname="$$OMNIGENT_POSTGRES_DB" -c "GRANT ALL ON SCHEMA public TO $$role_sql"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane-network
    restart: "no"

  omnigent-agent-init:
    image: ${OMNIGENT_IMAGE_REF:-${OMNIGENT_IMAGE:-ghcr.io/omnigent-ai/omnigent-server}:${OMNIGENT_IMAGE_TAG:-latest}}
    environment:
      - DATABASE_URL=postgresql://${OMNIGENT_POSTGRES_USER:-omnigent}:${OMNIGENT_POSTGRES_PASSWORD:-omnigent}@postgres:5432/${OMNIGENT_POSTGRES_DB:-omnigent}
      - ARTIFACT_DIR=${OMNIGENT_ARTIFACT_DIR:-/data/artifacts}
    command:
      - python
      - /opt/moonmind/register_omnigent_agent.py
      - /opt/moonmind/agents/opencode-native-ui
    volumes:
      - omnigent-data:/data
      - ./tools/register_omnigent_agent.py:/opt/moonmind/register_omnigent_agent.py:ro
      - ./services/omnigent/agents/opencode-native-ui:/opt/moonmind/agents/opencode-native-ui:ro
    depends_on:
      postgres:
        condition: service_healthy
      omnigent-db-init:
        condition: service_completed_successfully
    networks:
      - control-plane-network
    restart: "no"

  omnigent:
    image: ${OMNIGENT_IMAGE_REF:-${OMNIGENT_IMAGE:-ghcr.io/omnigent-ai/omnigent-server}:${OMNIGENT_IMAGE_TAG:-latest}}
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://${OMNIGENT_POSTGRES_USER:-omnigent}:${OMNIGENT_POSTGRES_PASSWORD:-omnigent}@postgres:5432/${OMNIGENT_POSTGRES_DB:-omnigent}
      - ARTIFACT_DIR=${OMNIGENT_ARTIFACT_DIR:-/data/artifacts}
      - HOST=0.0.0.0
      - PORT=8000
      - OMNIGENT_CONFIG=${OMNIGENT_CONFIG:-}
      - OMNIGENT_AUTH_ENABLED=${OMNIGENT_AUTH_ENABLED:-1}
      - OMNIGENT_AUTH_PROVIDER=${OMNIGENT_AUTH_PROVIDER:-}
      - OMNIGENT_ACCOUNTS_COOKIE_SECRET=${OMNIGENT_ACCOUNTS_COOKIE_SECRET:-}
      - OMNIGENT_ACCOUNTS_BASE_URL=${OMNIGENT_ACCOUNTS_BASE_URL:-http://localhost:${OMNIGENT_PORT:-8000}}
      - OMNIGENT_WS_ALLOWED_ORIGINS=${OMNIGENT_WS_ALLOWED_ORIGINS:-${OMNIGENT_ACCOUNTS_BASE_URL:-http://localhost:${OMNIGENT_PORT:-8000},http://127.0.0.1:${OMNIGENT_PORT:-8000},http://host.docker.internal:${OMNIGENT_PORT:-8000},http://${HOSTNAME:-localhost}:${OMNIGENT_PORT:-8000},http://${COMPUTERNAME:-localhost}:${OMNIGENT_PORT:-8000}}}
      - OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD=${OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD:-}
      - OMNIGENT_ACCOUNTS_SESSION_TTL_HOURS=${OMNIGENT_ACCOUNTS_SESSION_TTL_HOURS:-8}
      - OMNIGENT_ACCOUNTS_INVITE_TTL_HOURS=${OMNIGENT_ACCOUNTS_INVITE_TTL_HOURS:-72}
      - OMNIGENT_ACCOUNTS_MAGIC_TTL_MINUTES=${OMNIGENT_ACCOUNTS_MAGIC_TTL_MINUTES:-10}
      - OMNIGENT_ACCOUNTS_AUTO_OPEN=${OMNIGENT_ACCOUNTS_AUTO_OPEN:-0}
      - OMNIGENT_OIDC_ISSUER=${OMNIGENT_OIDC_ISSUER:-}
      - OMNIGENT_OIDC_CLIENT_ID=${OMNIGENT_OIDC_CLIENT_ID:-}
      - OMNIGENT_OIDC_CLIENT_SECRET=${OMNIGENT_OIDC_CLIENT_SECRET:-}
      - OMNIGENT_OIDC_COOKIE_SECRET=${OMNIGENT_OIDC_COOKIE_SECRET:-}
      - OMNIGENT_OIDC_SCOPES=${OMNIGENT_OIDC_SCOPES:-openid profile email}
      - OMNIGENT_OIDC_SESSION_TTL_HOURS=${OMNIGENT_OIDC_SESSION_TTL_HOURS:-8}
      - OMNIGENT_OIDC_ALLOWED_DOMAINS=${OMNIGENT_OIDC_ALLOWED_DOMAINS:-}
      - OMNIGENT_OIDC_LOGOUT_REDIRECT_URI=${OMNIGENT_OIDC_LOGOUT_REDIRECT_URI:-}
      - OMNIGENT_OIDC_ALLOW_INVITES=${OMNIGENT_OIDC_ALLOW_INVITES:-}
      - OMNIGENT_DOMAIN=${OMNIGENT_DOMAIN:-}
      - OMNIGENT_HOST_IMAGE=${OMNIGENT_HOST_IMAGE:-ghcr.io/omnigent-ai/omnigent-host}
      - OMNIGENT_HOST_IMAGE_TAG=${OMNIGENT_HOST_IMAGE_TAG:-latest}
    ports:
      # Development-only direct exposure of the stock Omnigent server. Workflow
      # Chat never uses this published port: the browser reaches the native UI
      # exclusively through MoonMind-scoped routes (/omnigent-ui/workflow-chat/*)
      # and the API facade (/api/workflow-chat-bindings/*), and MoonMind reaches
      # the server over the internal Compose network (OMNIGENT_SERVER_URL).
      # Set OMNIGENT_PORT to an unroutable/loopback binding to disable it
      # (MoonLadderStudios/MoonMind#3638 §7).
      - "${OMNIGENT_PORT:-8000}:8000"
    volumes:
      - omnigent-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      omnigent-db-init:
        condition: service_completed_successfully
      omnigent-agent-init:
        condition: service_completed_successfully
    networks:
      - control-plane-network
      - omnigent-egress-network
    restart: unless-stopped

  agent-workspaces-init:
    image: alpine:3.20
    command: >-
      sh -lc "set -e; for dir in /work/agent_jobs /work/agent_jobs/artifacts
      /work/agent_jobs/managed_runs /work/agent_jobs/managed_sessions
      /work/agent_jobs/workspaces; do mkdir -p \"$$dir\" && chown 1000:1000
      \"$$dir\" && chmod 0775 \"$$dir\"; done"
    volumes:
      - agent_workspaces:/work/agent_jobs
    restart: "no"

  codex-auth-init:
    image: alpine:3.20
    environment:
      - CODEX_HOME=${CODEX_VOLUME_PATH:-/home/app/.codex}
    command: >-
      sh -lc "CODEX_HOME=$${CODEX_HOME:-/home/app/.codex}; mkdir -p
      \"$${CODEX_HOME}\" && chown -R 1000:1000 \"$${CODEX_HOME}\" && chmod 0775
      \"$${CODEX_HOME}\""
    volumes:
      - codex_auth_volume:${CODEX_VOLUME_PATH:-/home/app/.codex}
    restart: "no"

  claude-auth-init:
    image: alpine:3.20
    command: >-
      sh -lc "mkdir -p ${CLAUDE_VOLUME_PATH:-/home/app/.claude} && chown -R
      1000:1000 ${CLAUDE_VOLUME_PATH:-/home/app/.claude} && chmod 0775
      ${CLAUDE_VOLUME_PATH:-/home/app/.claude}"
    volumes:
      - claude_auth_volume:${CLAUDE_VOLUME_PATH:-/home/app/.claude}
    restart: "no"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1
    environment:
      INFO: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
      SESSION: 1
      NETWORKS: 1
      POST: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - docker-proxy-network
    restart: unless-stopped

  sandbox-egress-proxy:
    container_name: moonmind-sandbox-egress-proxy
    image: ubuntu/squid:latest
    labels:
      moonmind.egress.profile-set-digest: sha256:ce9e19f22079cd8dc4dd4d14f943b4055b5788bed49188b5c9085b5af82b7ebc
      moonmind.egress.enforcer: docker-internal-proxy/v1
      moonmind.egress.config-digest: sha256:f79931d832bcc9901928ce17931720b6a42fba7bb09b531c211bff9325b12dfa
    volumes:
      - ./docker/sandbox-egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    expose:
      - "3128"
      - "3129"
    networks:
      control-plane-network: {}
      sandbox-egress-network: {}
      restricted-egress-network: {}
      omnigent-egress-network:
        aliases:
          - omnigent-egress-proxy
    healthcheck:
      test: ["CMD-SHELL", "squid -k parse && test \"$$(sha256sum /etc/squid/squid.conf | cut -d' ' -f1)\" = f79931d832bcc9901928ce17931720b6a42fba7bb09b531c211bff9325b12dfa"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant-storage:
  omnigent-host-state:
  omnigent-host-claude-state:
  omnigent-host-claude-home:
  omnigent-host-codex-state:
  omnigent-tools:
    name: moonmind-omnigent-tools-gh-${OMNIGENT_GH_VERSION:-2.76.2}
  postgres-data:
  minio-data:
  workflow_workspaces:
  agent_workspaces:
    name: ${MOONMIND_AGENT_WORKSPACES_VOLUME_NAME:-agent_workspaces}
  moonmind_secrets:
    name: ${MOONMIND_SECRETS_VOLUME_NAME:-moonmind_secrets}
  moonmind_retrieval_state:
    name: ${MOONMIND_RETRIEVAL_STATE_VOLUME_NAME:-moonmind_retrieval_state}
  unreal_ccache_volume:
    name: ${MOONMIND_UNREAL_CCACHE_VOLUME_NAME:-unreal_ccache_volume}
  omnigent-host-artifacts:
  omnigent-host-cache:
  unreal_ubt_volume:
    name: ${MOONMIND_UNREAL_UBT_VOLUME_NAME:-unreal_ubt_volume}
  codex_auth_volume:
    name: ${CODEX_VOLUME_NAME:-codex_auth_volume}
  claude_auth_volume:
    name: ${CLAUDE_VOLUME_NAME:-claude_auth_volume}
  omnigent-data:

networks:
  control-plane-network:
    name: ${MOONMIND_CONTROL_PLANE_NETWORK:-moonmind_control-plane-network}
  docker-proxy-network:
    name: ${MOONMIND_DOCKER_PROXY_NETWORK:-moonmind_docker-proxy-network}
    internal: true
  sandbox-egress-network:
    name: ${MOONMIND_SANDBOX_EGRESS_NETWORK:-moonmind_sandbox-egress-network}
    internal: true
  restricted-egress-network:
    name: ${MOONMIND_RESTRICTED_EGRESS_NETWORK:-moonmind_restricted-egress-network}
    internal: true
  omnigent-egress-network:
    name: ${MOONMIND_OMNIGENT_EGRESS_NETWORK:-moonmind_omnigent-egress-network}
    internal: true
