# Shared static Omnigent host template (MoonLadderStudios/MoonMind#3834).
#
# One source of truth for the common static Codex/Claude host configuration.
# Both `omnigent-host-codex` and `omnigent-host-claude` keep their explicit
# service names and `omnigent-host-codex` / `omnigent-host-claude` profiles,
# but share: the digest-pinned `omnigent-host-moonmind` image, uid/gid, home,
# workdir, read-only root, tmpfs, capabilities, no-new-privileges, resource
# limits, restart behavior, Omnigent endpoint, workspace/Skill/tool/state
# boundaries, egress network, and the generic health shape. Runtime differences
# are limited to the trusted pack/materializer selection
# (`MOONMIND_OMNIGENT_RUNTIME_PACK_REF` /
# `MOONMIND_OMNIGENT_CREDENTIAL_MATERIALIZER_REF`) plus that runtime's own
# credential attachment and generation marker.
#
# The values below are intentionally duplicated explicitly in each service so
# `docker compose config` keeps showing the final operator-visible contract.
# `tests/unit/omnigent/test_static_host_consolidation.py` fails if any service
# drifts from this anchor. Do not introduce templating that hides the contract.
#
# Rollback: set OMNIGENT_SHARED_HOST_IMAGE_REF to the prior pinned digest, or
# revert this file; the thin `start-*-oauth-host.sh` / `check-*-oauth-host.sh`
# wrappers keep their old container paths during migration. The legacy
# OMNIGENT_HOST_IMAGE_REF variable is honored only as a bounded alias by
# `moonmind.omnigent.harness_platform.static_hosts.resolve_static_host_image_ref`
# when OMNIGENT_SHARED_HOST_IMAGE_REF is unset; legacy mutable
# OMNIGENT_HOST_IMAGE / OMNIGENT_HOST_IMAGE_TAG construction is not honored
# for static hosts.
x-omnigent-static-host:
  image: ${OMNIGENT_SHARED_HOST_IMAGE_REF:-${OMNIGENT_SHARED_HOST_IMAGE:-ghcr.io/moonladderstudios/omnigent-host-moonmind}:${OMNIGENT_SHARED_HOST_IMAGE_TAG:-1.18.11}}
  user: "1000:1000"
  working_dir: /home/app
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=${OMNIGENT_HOST_TMPFS_LIMIT:-256m}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: ${OMNIGENT_HOST_CPU_LIMIT:-2}
  mem_limit: ${OMNIGENT_HOST_MEMORY_LIMIT:-4096m}
  pids_limit: ${OMNIGENT_HOST_PIDS_LIMIT:-256}
  stop_grace_period: ${OMNIGENT_HOST_STOP_GRACE_SECONDS:-20}s
  restart: unless-stopped
  entrypoint: ["/opt/moonmind/start-omnigent-host.sh"]

services:
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:24.0
    command: >
      start-dev --proxy-headers=xforwarded --hostname-url=http://keycloak:8080
      --import-realm --db=postgres
      --db-url=jdbc:postgresql://postgres:5432/keycloak --db-username=keycloak
      --db-password=${KC_DB_PW:-keycloak}
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PW:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8085:8080"] # host→container
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control-plane-network]
    restart: unless-stopped

  api:
    image: ${MOONMIND_IMAGE:-ghcr.io/moonladderstudios/moonmind:latest}
    init: true
    restart: unless-stopped
    ports:
      - "${MOONMIND_API_HOST_PORT:-7000}:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=${POSTGRES_HOST:-moonmind-api-db}
      - CODEX_TEMPLATE_PATH=/app/api_service/config.template.toml
      - FASTAPI_RELOAD=${FASTAPI_RELOAD:-false}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL_CONTEXT_PROTOCOL_ENABLED=true
      - MODEL_CONTEXT_PROTOCOL_PORT=8000
      - MODEL_CONTEXT_PROTOCOL_HOST=0.0.0.0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal-internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_ARTIFACT_BACKEND=${TEMPORAL_ARTIFACT_BACKEND:-s3}
      - TEMPORAL_ARTIFACT_S3_ENDPOINT=${TEMPORAL_ARTIFACT_S3_ENDPOINT:-http://moonmind-temporal-artifacts-s3:9000}
      - TEMPORAL_ARTIFACT_S3_PUBLIC_ENDPOINT=${TEMPORAL_ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - TEMPORAL_ARTIFACT_S3_BUCKET=${TEMPORAL_ARTIFACT_S3_BUCKET:-moonmind-temporal-artifacts}
      - TEMPORAL_ARTIFACT_S3_ACCESS_KEY_ID=${TEMPORAL_ARTIFACT_S3_ACCESS_KEY_ID:-minioadmin}
      - TEMPORAL_ARTIFACT_S3_SECRET_ACCESS_KEY=${TEMPORAL_ARTIFACT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - TEMPORAL_DASHBOARD_SUBMIT_ENABLED=true
      - TEMPORAL_WORKFLOW_EDITING_ENABLED=${TEMPORAL_WORKFLOW_EDITING_ENABLED:-true}
      - MOONMIND_CONTAINER_JOBS_ENABLED=${MOONMIND_CONTAINER_JOBS_ENABLED:-true}
      # `ContainerJobService.submit()` resolves the deployment's declared image
      # sources before it creates durable job identity, so the API must see the
      # same declarations as the worker that launches the job. Keep these two
      # values identical to `temporal-worker-agent-runtime`: a ref declared only
      # on the worker is rejected as unconfigured before the request ever
      # reaches Temporal.
      - MOONMIND_CONTAINER_BACKEND_IMAGE_SOURCES=${MOONMIND_CONTAINER_BACKEND_IMAGE_SOURCES:-[{"sourceRef":"tactics-unreal","image":"${MOONMIND_UNREAL_ENGINE_IMAGE:-ghcr.io/moonladderstudios/tactics-ue-base:5.8}","pullPolicy":"${MOONMIND_UNREAL_ENGINE_IMAGE_PULL_POLICY:-if-missing}"}]}
      - MOONMIND_CONTAINER_BACKEND_CACHE_SOURCES=${MOONMIND_CONTAINER_BACKEND_CACHE_SOURCES:-[{"cacheRef":"unreal-ccache","volumeName":"${MOONMIND_UNREAL_CCACHE_VOLUME_NAME:-unreal_ccache_volume}","target":"/home/ue4/.ccache"},{"cacheRef":"unreal-ubt","volumeName":"${MOONMIND_UNREAL_UBT_VOLUME_NAME:-unreal_ubt_volume}","target":"/home/ue4/.config/Epic/UnrealBuildTool"}]}
      # Omnigent is a normal local runtime. Operators can still disable or
      # redirect it explicitly, but the canonical Compose path needs no hidden
      # enablement variables.
      - OMNIGENT_ENABLED=${OMNIGENT_ENABLED:-true}
      - OMNIGENT_SERVER_URL=${OMNIGENT_SERVER_URL:-http://omnigent:8000}
      # Native Omnigent Workflow Chat UI is served through MoonMind-scoped routes
      # (MoonLadderStudios/MoonMind#3638): the browser reaches the native UI at
      # /omnigent-ui/workflow-chat/{chatBindingId} on the MoonMind origin, never
      # the upstream server directly. Enabled by default. The compatibility
      # version is derived from the same immutable server image evidence the
      # execution catalog already requires (OMNIGENT_IMAGE_REF digest), so
      # pinning the image is the only step needed to serve native chat. A
      # mutable tag stays unverified and the gate fails closed
      # (MoonLadderStudios/MoonMind#3685). OMNIGENT_NATIVE_UI_VERSION is the
      # explicit override an operator sets after a new build passes conformance.
      - OMNIGENT_NATIVE_UI_ENABLED=${OMNIGENT_NATIVE_UI_ENABLED:-true}
      - OMNIGENT_NATIVE_UI_VERSION=${OMNIGENT_NATIVE_UI_VERSION:-}
      - OMNIGENT_IMAGE_REF=${OMNIGENT_IMAGE_REF:-}
      - OMNIGENT_BUILD_DIGEST=${OMNIGENT_BUILD_DIGEST:-}
      - OMNIGENT_IMAGE=${OMNIGENT_IMAGE:-ghcr.io/omnigent-ai/omnigent-server}
      - OMNIGENT_IMAGE_TAG=${OMNIGENT_IMAGE_TAG:-latest}
      - OMNIGENT_HOST_IMAGE_REF=${OMNIGENT_HOST_IMAGE_REF:-}
      - OMNIGENT_HOST_IMAGE=${OMNIGENT_HOST_IMAGE:-ghcr.io/omnigent-ai/omnigent-host}
      - OMNIGENT_HOST_IMAGE_TAG=${OMNIGENT_HOST_IMAGE_TAG:-latest}
      - OMNIGENT_OPENCODE_HOST_IMAGE_REF=${OMNIGENT_OPENCODE_HOST_IMAGE_REF:-}
      - OMNIGENT_OPENCODE_HOST_IMAGE=${OMNIGENT_OPENCODE_HOST_IMAGE:-ghcr.io/moonladderstudios/omnigent-host-opencode}
      - OMNIGENT_OPENCODE_HOST_IMAGE_TAG=${OMNIGENT_OPENCODE_HOST_IMAGE_TAG:-1.18.11}
      - OMNIGENT_PI_HOST_IMAGE_REF=${OMNIGENT_PI_HOST_IMAGE_REF:-}
      - OMNIGENT_SHARED_HOST_IMAGE_REF=${OMNIGENT_SHARED_HOST_IMAGE_REF:-}
      - OMNIGENT_SHARED_HOST_IMAGE=${OMNIGENT_SHARED_HOST_IMAGE:-ghcr.io/moonladderstudios/omnigent-host-moonmind}
      - OMNIGENT_SHARED_HOST_IMAGE_TAG=${OMNIGENT_SHARED_HOST_IMAGE_TAG:-1.18.11}
      - MOONMIND_OMNIGENT_GENERIC_HOST_ENABLED=${MOONMIND_OMNIGENT_GENERIC_HOST_ENABLED:-true}
      - MOONMIND_OMNIGENT_OPENCODE_ENABLED=${MOONMIND_OMNIGENT_OPENCODE_ENABLED:-true}
      - MOONMIND_OMNIGENT_GENERIC_CODEX_QUALIFIED=${MOONMIND_OMNIGENT_GENERIC_CODEX_QUALIFIED:-false}
      - MOONMIND_OMNIGENT_GENERIC_CLAUDE_QUALIFIED=${MOONMIND_OMNIGENT_GENERIC_CLAUDE_QUALIFIED:-false}
      - MOONMIND_OMNIGENT_EVIDENCE_POLICY=${MOONMIND_OMNIGENT_EVIDENCE_POLICY:-either}
      - MOONMIND_OMNIGENT_DEPLOYMENT_EVIDENCE=${MOONMIND_OMNIGENT_DEPLOYMENT_EVIDENCE:-/workspace/omnigent-evidence/deployment-execution-evidence.json}
      - MOONMIND_OMNIGENT_HOST_SERVER_URL=${MOONMIND_OMNIGENT_HOST_SERVER_URL:-http://omnigent:8000}
      - MOONMIND_OMNIGENT_EXPECTED_HOST_OWNER=${MOONMIND_OMNIGENT_EXPECTED_HOST_OWNER:-local}
      - MOONMIND_OMNIGENT_TOOLS_VOLUME_REF=${MOONMIND_OMNIGENT_TOOLS_VOLUME_REF:-moonmind-omnigent-tools-gh-2.76.2}
      - MOONMIND_CODEX_OMNIGENT_CUTOVER_PHASE=${MOONMIND_CODEX_OMNIGENT_CUTOVER_PHASE:-opt_in}
      - MOONMIND_CODEX_OMNIGENT_DEPLOYED_PHASE=${MOONMIND_CODEX_OMNIGENT_DEPLOYED_PHASE:-opt_in}
      - MOONMIND_CODEX_OMNIGENT_CONFORMANCE_EVIDENCE_REF=${MOONMIND_CODEX_OMNIGENT_CONFORMANCE_EVIDENCE_REF:-/workspace/cutover/promotion.json}
      - MOONMIND_OMNIGENT_REMEDIATION_RELEASE_EVIDENCE_REF=${MOONMIND_OMNIGENT_REMEDIATION_RELEASE_EVIDENCE_REF:-/workspace/cutover/remediation-release.json}
      # Release-support evidence the catalog reads for the deployed commit
      # (MoonLadderStudios/MoonMind#3710). These default to the durable
      # evidence directory mounted below, so `tools/materialize_omnigent_evidence.py`
      # is the only step an operator runs to make the deployed catalog report
      # real acceptance, exact-artifact, and protected-live status. No env
      # configuration is required for the default deployment path.
      - MOONMIND_OMNIGENT_ACCEPTANCE_MANIFEST=${MOONMIND_OMNIGENT_ACCEPTANCE_MANIFEST:-/workspace/omnigent-evidence/acceptance-manifest.json}
      - MOONMIND_OMNIGENT_EXECUTION_SUPPORT_EVIDENCE=${MOONMIND_OMNIGENT_EXECUTION_SUPPORT_EVIDENCE:-/workspace/omnigent-evidence/execution-support-evidence.json}
      - MOONMIND_OMNIGENT_EXACT_ARTIFACT_EVIDENCE=${MOONMIND_OMNIGENT_EXACT_ARTIFACT_EVIDENCE:-/workspace/omnigent-evidence/exact-artifact-projection.json}
      - MOONMIND_OMNIGENT_LIVE_HEALTH_PROJECTION=${MOONMIND_OMNIGENT_LIVE_HEALTH_PROJECTION:-/workspace/omnigent-evidence/live-health-projection.json}
      # The API needs DOCKER_HOST only for its remaining direct Docker paths
      # (terminal exec, OAuth auth-runner teardown). SYSTEM_DOCKER_HOST is a
      # trusted-worker-only backend selector and is not read by the API service.
      - DOCKER_HOST=${SYSTEM_DOCKER_HOST:-tcp://docker-proxy:2375}
      - MOONMIND_CONTROL_PLANE_NETWORK=${MOONMIND_CONTROL_PLANE_NETWORK:-moonmind_control-plane-network}
      - MOONMIND_DEPLOYMENT_PROJECT_NAME=${MOONMIND_DEPLOYMENT_PROJECT_NAME:-moonmind}
      - MOONMIND_OAUTH_RUNNER_IMAGE=${MOONMIND_OAUTH_RUNNER_IMAGE:-${MOONMIND_IMAGE:-ghcr.io/moonladderstudios/moonmind:latest}}
      - MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION=${MOONMIND_ALLOW_LOCAL_ENCRYPTION_KEY_GENERATION:-1}
      - MOONMIND_DEPLOYMENT_DESIRED_STATE_JSON_FILE=${MOONMIND_DEPLOYMENT_DESIRED_STATE_JSON_FILE:-/workspace/deployment_state/desired-state.json}
      # Managed-runtime cleanup is operational by default. The API owns the
      # Temporal schedule state; the agent-runtime worker performs each pass.
      - MOONMIND_AGENT_RUNTIME_STORE=${MOONMIND_AGENT_RUNTIME_STORE:-/work/agent_jobs}
      - MOONMIND_AGENT_RUNTIME_ARTIFACTS=${MOONMIND_AGENT_RUNTIME_ARTIFACTS:-/work/agent_jobs/artifacts}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_ENABLED=${MOONMIND_MANAGED_RUNTIME_JANITOR_ENABLED:-true}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_DRY_RUN=${MOONMIND_MANAGED_RUNTIME_JANITOR_DRY_RUN:-false}
      - MOONMIND_MANAGED_RUNTIME_WORKSPACE_RETENTION_DAYS=${MOONMIND_MANAGED_RUNTIME_WORKSPACE_RETENTION_DAYS:-10}
      - MOONMIND_MANAGED_RUNTIME_ARTIFACT_RETENTION_DAYS=${MOONMIND_MANAGED_RUNTIME_ARTIFACT_RETENTION_DAYS:-90}
      - MOONMIND_MANAGED_RUNTIME_RECORD_RETENTION_DAYS=${MOONMIND_MANAGED_RUNTIME_RECORD_RETENTION_DAYS:-}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_GRACE_SECONDS=${MOONMIND_MANAGED_RUNTIME_JANITOR_GRACE_SECONDS:-3600}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_MAX_DELETE_PATHS=${MOONMIND_MANAGED_RUNTIME_JANITOR_MAX_DELETE_PATHS:-100}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_MAX_DELETE_BYTES=${MOONMIND_MANAGED_RUNTIME_JANITOR_MAX_DELETE_BYTES:-}
      - MOONMIND_MANAGED_RUNTIME_JANITOR_LOCK_PATH=${MOONMIND_MANAGED_RUNTIME_JANITOR_LOCK_PATH:-/work/agent_jobs/.janitor.lock}
      # OIDC specific variables for API service
      - AUTH_PROVIDER=${AUTH_PROVIDER:-disabled} # local, google, or disabled
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://keycloak:8080/realms/moonmind} # For 'local'
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-api-service} # For 'local', matches realm-export.json
      - OIDC_CLIENT_SECRET=${API_CLIENT_SECRET:-changeme} # For 'local', matches realm-export.json
      - JWT_SECRET=${JWT_SECRET:-devsecret} # For 'disabled' auth provider (legacy JWT)
    env_file:
      - path: .env
        required: false
    volumes:
      - ./api_service:/app/api_service
      - ./moonmind:/app/moonmind:ro
      - ./docs:/app/docs:ro
      - ./.agents:/app/.agents:ro
      - ./deploy/state:/workspace/deployment_state:ro
      - ${MOONMIND_CODEX_OMNIGENT_EVIDENCE_DIR:-./var/cutover}:/workspace/cutover:ro
      # Durable release-support evidence for the deployed commit, materialized by
      # tools/materialize_omnigent_evidence.py. Read-only: the API consumes
      # published evidence and never produces it.
      - ${MOONMIND_OMNIGENT_EVIDENCE_DIR:-./var/omnigent-evidence}:/workspace/omnigent-evidence:rw
      - ./var/omnigent-runtime-state:/app/var/omnigent-runtime-state:rw
      - ./keycloak:/app/keycloak:ro # Mount keycloak configs if needed by api, or remove if only for keycloak service
      - moonmind_secrets:/app/var/secrets
      # Live retrieval capability authority, accounting, and bounded evidence.
      # Must outlive container recreation or an update would invalidate
      # still-live capabilities and discard durable retrieval records.
      - moonmind_retrieval_state:/app/var/retrieval-follow-up
      - agent_workspaces:/work/agent_jobs:ro
      - workflow_workspaces:/work/runs:ro
    command: sh /app/api_service/entrypoint.sh
    networks:
      - control-plane-network
      - docker-proxy-network
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "ai.model.context.protocol.version=2025-03-26"
      - "ai.model.context.protocol.endpoint=/mcp"
      - "moonmind.runtime_source_revision=${MOONMIND_RUNTIME_SOURCE_REVISION:-untracked}"
    depends_on:
      init-db:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      docker-proxy:
        condition: service_started

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-moonmind}
      TEMPORAL_POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      TEMPORAL_POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
      TEMPORAL_VISIBILITY_DB: ${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
      KC_DB_PW: ${KC_DB_PW:-keycloak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_db_scripts:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    networks:
      control-plane-network:
        aliases:
          - moonmind-api-db
          - temporal-db
      sandbox-egress-network:
        aliases:
          - moonmind-api-db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonmind}
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.1}
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - DBNAME=${TEMPORAL_POSTGRES_DB:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
      - NUM_HISTORY_SHARDS=${TEMPORAL_NUM_HISTORY_SHARDS:-1}
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamicconfig/development-sql.yaml
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
      - BIND_ON_IP=0.0.0.0
    ports:
      - "7233:7233"
    volumes:
      - ./services/temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      control-plane-network:
        aliases:
          - temporal-internal
      sandbox-egress-network:
        aliases:
          - temporal-internal
    restart: unless-stopped

  # Network alias `moonmind-temporal-artifacts-s3` is the stable S3 hostname for
  # Temporal artifacts. Do not use the generic name `minio` in TEMPORAL_ARTIFACT_S3_ENDPOINT
  # when other compose stacks on this network also expose MinIO as `minio` (DNS returns
  # multiple backends → intermittent NoSuchKey).
  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      control-plane-network:
        aliases:
          - moonmind-temporal-artifacts-s3
      sandbox-egress-network:
        aliases:
          - moonmind-temporal-artifacts-s3
    restart: unless-stopped

  temporal-namespace-init:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal-internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_NAMESPACE_RETENTION_DAYS=${TEMPORAL_NAMESPACE_RETENTION_DAYS:-90}
      - TEMPORAL_RETENTION_MAX_STORAGE_GB=${TEMPORAL_RETENTION_MAX_STORAGE_GB:-100}
      - TEMPORAL_RETENTION_ESTIMATED_GB_PER_DAY=${TEMPORAL_RETENTION_ESTIMATED_GB_PER_DAY:-1}
    volumes:
      - ./services/temporal/scripts/bootstrap-namespace.sh:/etc/temporal/bootstrap-namespace.sh:ro
    entrypoint:
      - /bin/sh
      - /etc/temporal/bootstrap-namespace.sh
    depends_on:
      temporal:
        condition: service_started
    networks:
      - control-plane-network
    restart: "no"

  temporal-visibility-rehearsal:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    profiles: ["temporal-tools"]
    environment:
      - TEMPORAL_POSTGRES_HOST=postgres
      - TEMPORAL_POSTGRES_PORT=5432
      - TEMPORAL_POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - TEMPORAL_POSTGRES_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - TEMPORAL_VISIBILITY_DB=${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
      - TEMPORAL_VISIBILITY_SCHEMA_DIR=${TEMPORAL_VISIBILITY_SCHEMA_DIR:-/etc/temporal/schema/postgresql/v12/visibility/versioned}
      - TEMPORAL_NUM_HISTORY_SHARDS=${TEMPORAL_NUM_HISTORY_SHARDS:-1}
      - TEMPORAL_SHARD_DECISION_ACK=${TEMPORAL_SHARD_DECISION_ACK:-}
    volumes:
      - ./services/temporal/scripts/rehearse-visibility-schema-upgrade.sh:/etc/temporal/rehearse-visibility-schema-upgrade.sh:ro
    entrypoint:
      - /bin/sh
      - /etc/temporal/rehearse-visibility-schema-upgrade.sh
    depends_on:
      temporal:
        condition: service_started
      temporal-namespace-init:
        condition: service_completed_successfully
    networks:
      - control-plane-network
    restart: "no"

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    profiles: ["temporal-tools"]
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal-internal:7233}
    command: sh -lc "sleep infinity"
    depends_on:
      temporal:
        condition: service_started
      temporal-namespace-init:
        condition: service_completed_successfully
    networks:
      - control-plane-network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    profiles: ["temporal-ui"]
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal-internal:7233}
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8088}:8080"
    depends_on:
      temporal:
        condition: service_started
      temporal-namespace-init:
        condition: service_completed_successfully
    networks:
      - control-plane-network
    restart: unless-stopped

  temporal-worker-workflow:
    image: ${MOONMIND_IMAGE:-ghcr.io/moonladderstudios/moonmind:latest}
    init: true
    labels:
